<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>VoidAI Chat</title>
  <link rel="icon" href="https://mekabrine.space/voidai/webicon.png" type="image/png">
  <link rel="apple-touch-icon" href="https://mekabrine.space/voidai/appicon.jpeg">
  <style>
    :root {
      --user-color: #7E52F5;
      --ai-color: #474747;
      --text-color: #ffffff;
      --bg-color: #000000;
      --menu-bg: #1a1a1a;
      --input-height: 44px;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--menu-bg);
      padding: 10px;
      font-weight: bold;
      font-size: 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .menu-panel {
      position: absolute;
      top: 45px;
      left: 10px;
      background: var(--menu-bg);
      padding: 10px;
      border-radius: 6px;
      z-index: 999;
      display: none;
      flex-direction: column;
      gap: 6px;
    }
    .menu-panel input, select, button {
      background: #222;
      color: white;
      border: 1px solid #555;
      padding: 6px;
      width: 100%;
    }
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
      padding-bottom: calc(var(--input-height) + 20px);
    }
    .message {
      padding: 15px 12px;
      border-radius: 10px;
      white-space: pre-wrap;
      position: relative;
      max-width: calc(100% - 50px);
      width: fit-content;
      min-height: 40px;
      min-width: 100px;
    }
    .message-content {
      margin-bottom: 25px;
    }
    .user {
      background: var(--user-color);
      align-self: flex-end;
      margin-left: 50px;
    }
    .assistant {
      background: var(--ai-color);
      align-self: flex-start;
      margin-right: 50px;
    }
    .token {
      position: absolute;
      font-size: 0.75rem;
      color: #ccc;
      bottom: 5px;
    }
    .user .token {
      right: 10px;
    }
    .assistant .token {
      left: 10px;
    }
    form#chatForm {
      display: flex;
      padding: 10px;
      background: var(--menu-bg);
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      gap: 10px;
      align-items: center;
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
    }
    #chatForm input {
      flex: 1;
      padding: 12px 15px;
      font-size: 1rem;
      border: none;
      border-radius: 4px;
      min-width: 0;
      height: var(--input-height);
    }
    #chatForm button {
      padding: 0;
      font-size: 1rem;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      width: var(--input-height);
      height: var(--input-height);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .typing-indicator {
      font-style: italic;
      opacity: 0.7;
      margin-left: 4px;
    }
    .message-actions {
      position: absolute;
      bottom: 5px;
      display: flex;
      gap: 5px;
    }
    .user .message-actions {
      right: 10px;
    }
    .assistant .message-actions {
      left: 10px;
    }
    .message-action {
      background: rgba(0,0,0,0.3);
      border: none;
      color: white;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .message-action:hover {
      background: rgba(0,0,0,0.5);
    }
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      z-index: 1000;
      animation: fadeInOut 2s ease-in-out;
    }
    @keyframes fadeInOut {
      0% { opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { opacity: 0; }
    }
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: var(--menu-bg);
      padding: 20px;
      border-radius: 10px;
      max-width: 90%;
      max-height: 80%;
      overflow: auto;
      position: relative;
      width: 600px;
    }
    .modal-close {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #ff4444;
      border: none;
      color: white;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
    }
    .modal-text {
      white-space: pre-wrap;
      user-select: text;
    }

    /* Heading styles based on hashtags */
    .message h1 {
      font-size: 1.5em;
      margin: 0.5em 0;
      font-weight: bold;
    }
    .message h2 {
      font-size: 1.3em;
      margin: 0.4em 0;
      font-weight: bold;
    }
    .message h3 {
      font-size: 1.1em;
      margin: 0.3em 0;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .top-bar {
        height: 40px;
        font-size: 0.9rem;
        padding: 0 8px;
      }
      .menu-panel {
        width: calc(100% - 20px);
        left: 10px;
      }
      .message {
        max-width: calc(100% - 30px);
      }
      .user {
        margin-left: 30px;
      }
      .assistant {
        margin-right: 30px;
      }
      form#chatForm {
        flex-direction: row;
        padding: 8px;
      }
      form#chatForm input {
        font-size: 1rem;
        padding: 10px;
      }
      form#chatForm button {
        width: 40px;
        height: 40px;
      }
      .chat-container {
        padding-bottom: calc(var(--input-height) + 20px);
      }
      .message {
        font-size: 0.95rem;
      }
      .modal-content {
        width: 95%;
      }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <span id="menuBtn">☰ Menu</span>
    <a href="https://www.voidai.app" target="_blank" style="text-decoration: none; color: inherit;">API by voidai.app</a>
    <span id="newChatBtn">+ New Chat</span>
  </div>
  <div class="menu-panel" id="menuPanel">
    <input type="text" id="apiKey" placeholder="Enter API Key">
    <label><input type="checkbox" id="saveKey"> Save Key</label>
    <select id="modelSelect">
      <option value="gpt-4.1-mini">gpt-4.1-mini</option>
      <option value="deepseek-v3">deepseek-v3</option>
    </select>
    <button id="exportBtn">Export Chat</button>
    <button id="importBtn">Import Chat</button>
    <input type="file" id="fileInput" accept=".vai" style="display: none;">
  </div>
  <div class="chat-container" id="chatContainer"></div>
  <form id="chatForm">
    <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off">
    <button type="submit">🔼</button>
  </form>

  <script>
    const chatContainer = document.getElementById("chatContainer");
    const chatForm = document.getElementById("chatForm");
    const userInput = document.getElementById("userInput");
    const apiKeyInput = document.getElementById("apiKey");
    const saveKeyCheckbox = document.getElementById("saveKey");
    const modelSelect = document.getElementById("modelSelect");
    const menuBtn = document.getElementById("menuBtn");
    const newChatBtn = document.getElementById("newChatBtn");
    const menuPanel = document.getElementById("menuPanel");
    const exportBtn = document.getElementById("exportBtn");
    const importBtn = document.getElementById("importBtn");
    const fileInput = document.getElementById("fileInput");

    let messages = [{ role: "system", content: "You're a helpful assistant." }];
    let isTyping = false;
    const isMobile = /Mobi|Android/i.test(navigator.userAgent);

    function renderMarkdown(text) {
      // Convert hashtags to headings
      let html = text
        .replace(/^# (.*$)/gm, '<h1>$1</h1>')
        .replace(/^## (.*$)/gm, '<h2>$1</h2>')
        .replace(/^### (.*$)/gm, '<h3>$1</h3>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>');
      
      // Convert line breaks to <br> tags
      html = html.replace(/\n/g, '<br>');
      return html;
    }

    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.remove();
      }, 2000);
    }

    function showModal(content) {
      const modal = document.createElement('div');
      modal.className = 'modal';
      
      const modalContent = document.createElement('div');
      modalContent.className = 'modal-content';
      
      const closeBtn = document.createElement('button');
      closeBtn.className = 'modal-close';
      closeBtn.textContent = '×';
      closeBtn.addEventListener('click', () => modal.remove());
      
      const modalText = document.createElement('div');
      modalText.className = 'modal-text';
      modalText.textContent = content;
      
      modalContent.appendChild(closeBtn);
      modalContent.appendChild(modalText);
      modal.appendChild(modalContent);
      document.body.appendChild(modal);
      
      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          modal.remove();
        }
      });
    }

    function addMessage(role, content, tokens = 0) {
      const msg = document.createElement("div");
      msg.className = `message ${role}`;
      
      const contentDiv = document.createElement("div");
      contentDiv.className = "message-content";
      contentDiv.innerHTML = renderMarkdown(content);
      msg.appendChild(contentDiv);
      
      // Token counter
      const tokenEl = document.createElement("div");
      tokenEl.className = `token`;
      tokenEl.textContent = `${tokens} tokens`;
      msg.appendChild(tokenEl);
      
      // Message actions
      const actions = document.createElement("div");
      actions.className = "message-actions";
      
      // Copy button
      const copyBtn = document.createElement("button");
      copyBtn.className = "message-action";
      copyBtn.textContent = "📋";
      copyBtn.title = "Copy message";
      copyBtn.addEventListener("click", () => {
        navigator.clipboard.writeText(content);
        showToast("Copied!");
      });
      
      // View button
      const viewBtn = document.createElement("button");
      viewBtn.className = "message-action";
      viewBtn.textContent = "🔍";
      viewBtn.title = "View message";
      viewBtn.addEventListener("click", () => {
        showModal(content);
      });
      
      // Always add buttons in same order: Copy, Select
      actions.appendChild(copyBtn);
      actions.appendChild(viewBtn);
      
      msg.appendChild(actions);
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function setTypingIndicator(on) {
      if (on && !isTyping) {
        isTyping = true;
        const indicator = document.createElement("div");
        indicator.id = "typing";
        indicator.className = "message assistant";
        indicator.innerHTML = '<span class="typing-indicator">Typing...</span>';
        chatContainer.appendChild(indicator);
        chatContainer.scrollTop = chatContainer.scrollHeight;
      } else if (!on && isTyping) {
        const typing = document.getElementById("typing");
        if (typing) typing.remove();
        isTyping = false;
      }
    }

    function countTokens(text) {
      return Math.ceil(text.split(/\s+/).length * 1.3); // approximate
    }

    function exportChat() {
      const now = new Date();
      const dateStr = `${now.getMonth()+1}_${now.getDate()}_${now.getFullYear().toString().slice(-2)}_${now.getHours()}${now.getMinutes()}`;
      const filename = `${dateStr}.vai`;
      
      const content = messages.map(msg => 
        `[{ role: "${msg.role}", content: "${msg.content.replace(/"/g, '\\"').replace(/\n/g, '\\n')}" }]`
      ).join('\n');
      
      const blob = new Blob([content], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function importChat() {
      fileInput.click();
    }

    function handleFileImport(e) {
      const file = e.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const content = event.target.result;
          // Parse the file content
          const lines = content.split('\n').filter(line => line.trim());
          const newMessages = [];
          
          for (const line of lines) {
            try {
              const match = line.match(/role: "([^"]+)", content: "([^"]+)"/);
              if (match) {
                newMessages.push({
                  role: match[1],
                  content: match[2].replace(/\\"/g, '"').replace(/\\n/g, '\n')
                });
              }
            } catch (err) {
              console.error('Error parsing line:', line, err);
            }
          }
          
          if (newMessages.length > 0) {
            if (confirm(`Import ${newMessages.length} messages? This will replace your current conversation.`)) {
              messages = newMessages;
              chatContainer.innerHTML = '';
              for (const msg of messages) {
                if (msg.role !== 'system') {
                  const tokens = countTokens(msg.content);
                  addMessage(msg.role, msg.content, tokens);
                }
              }
            }
          } else {
            alert('No valid messages found in the file.');
          }
        } catch (err) {
          alert('Error parsing file: ' + err.message);
        }
      };
      reader.readAsText(file);
    }

    // Handle form submission
    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      submitMessage();
    });

    // Handle keyboard input
    userInput.addEventListener("keydown", (e) => {
      if (isMobile) {
        // On mobile, only submit when pressing the submit button
        return;
      }
      
      // On desktop, submit on Enter but allow Shift+Enter for new lines
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        submitMessage();
      }
    });

    async function submitMessage() {
      const key = apiKeyInput.value.trim();
      if (!key) return alert("Enter API key.");
      const model = modelSelect.value;
      const prompt = userInput.value.trim();
      if (!prompt) return;
      userInput.value = "";
      const userTokens = countTokens(prompt);
      messages.push({ role: "user", content: prompt });
      addMessage("user", prompt, userTokens);
      setTypingIndicator(true);

      try {
        const res = await fetch("https://api.voidai.app/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${key}`,
          },
          body: JSON.stringify({
            model,
            messages
          }),
        });
        const data = await res.json();
        const aiMsg = data.choices[0].message.content;
        const aiTokens = data.usage?.completion_tokens || countTokens(aiMsg);
        messages.push({ role: "assistant", content: aiMsg });
        setTypingIndicator(false);
        addMessage("assistant", aiMsg, aiTokens);
      } catch (err) {
        setTypingIndicator(false);
        alert("Error: " + err.message);
      }
    }

    // Menu toggle
    menuBtn.addEventListener("click", () => {
      menuPanel.style.display = menuPanel.style.display === "flex" ? "none" : "flex";
    });

    // Save API key if checkbox is checked
    apiKeyInput.value = localStorage.getItem("voidai_key") || "";
    if (apiKeyInput.value) saveKeyCheckbox.checked = true;

    apiKeyInput.addEventListener("input", () => {
      if (saveKeyCheckbox.checked) {
        localStorage.setItem("voidai_key", apiKeyInput.value);
      }
    });

    saveKeyCheckbox.addEventListener("change", () => {
      if (saveKeyCheckbox.checked) {
        localStorage.setItem("voidai_key", apiKeyInput.value);
      } else {
        localStorage.removeItem("voidai_key");
      }
    });

    newChatBtn.addEventListener("click", () => {
      if (confirm("Start a new chat? This will erase your current conversation.")) {
        location.reload();
      }
    });

    exportBtn.addEventListener("click", exportChat);
    importBtn.addEventListener("click", importChat);
    fileInput.addEventListener("change", handleFileImport);

    // Close menu when clicking outside
    document.addEventListener('click', (e) => {
      if (!menuPanel.contains(e.target) && e.target !== menuBtn) {
        menuPanel.style.display = 'none';
      }
    });

    // Focus input on page load
    window.addEventListener('load', () => {
      userInput.focus();
    });
  </script>
</body>
</html>
