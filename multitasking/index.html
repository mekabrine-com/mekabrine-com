<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Minimal Window Opener</title>
  <style>
    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: 0;
      font-family: sans-serif;
      background: #f0f0f0;
    }
    input {
      padding: 10px;
      width: 300px;
      font-size: 16px;
      margin-bottom: 10px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <input id="urlInput" type="text" placeholder="Enter URL (https://...)">
  <button onclick="openWindow()">Open</button>

  <script>
    function openWindow() {
      const url = document.getElementById("urlInput").value;
      if (!url) return alert("Please enter a URL.");

      const features = `
        width=800,
        height=600,
        menubar=no,
        toolbar=no,
        location=no,
        status=no,
        resizable=yes,
        scrollbars=yes
      `.replace(/\s+/g, '');

      window.open(url, "_blank", features);
    }
  </script>

</body>
</html>
