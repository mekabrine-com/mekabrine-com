        damageOverlay.style.opacity = 0;
        this.showMeltdownText(false);
    },

    raycast(x1, y1, x2, y2, ignore = []) {
        let dist = getDistance(x1, y1, x2, y2); let steps = dist / 10; let dx = (x2 - x1) / steps, dy = (y2 - y1) / steps; let cx = x1, cy = y1;
        const hall = this.level.getCurrentHall(); const targets = [...hall.crates, ...hall.enemies, this.player];
        for(let i=0; i<steps; i++) {
            cx += dx; cy += dy; if (cy > 600 || cy < 0) return { x: cx, y: cy, type: 'wall' };
            for(let t of targets) {
                if (ignore.includes(t) || t.dead) continue;
                if (cx >= t.x && cx <= t.x+t.w && cy >= t.y && cy <= t.y+t.h) return { x: cx, y: cy, entity: t, type: (t.takeDamage) ? 'entity' : 'crate' };
            }
        }
        return { x: x2, y: y2, type: 'none' };
    },

    updateOverlaysAndShake() {
        const hp = clamp(this.player.health, 0, this.player.maxHealth);
        const ins = clamp(this.player.insanity, 0, this.player.maxInsanity);

        // purple overlay by insanity (0 -> 0%, 150 -> 25%)
        const purple = 0.25 * (ins / this.player.maxInsanity);
        purpleOverlay.style.opacity = purple.toFixed(3);

        // red overlay by health (150 -> 0%, 0 -> 50%) with heartbeat pulse
        let baseRed = 0.50 * (1 - (hp / this.player.maxHealth));

        if(hp < 50) {
            if(this._heartbeatTimer <= 0) {
                const intensity = clamp((50 - hp) / 50, 0.15, 1.0);
                AudioSys.heartbeat(0.6 + intensity*0.6);
                this._heartbeatPulse = 1.0;
                const bpm = 70 + (50 - hp) * 0.8;
                const framesPerBeat = Math.floor((60 * 60) / bpm);
                this._heartbeatTimer = clamp(framesPerBeat, 18, 52);
            } else {
                this._heartbeatTimer--;
            }
            this._heartbeatPulse *= 0.82;
            baseRed = clamp(baseRed + 0.10 * this._heartbeatPulse, 0, 0.50);
        } else {
            this._heartbeatTimer = 0;
            this._heartbeatPulse = 0;
            baseRed = clamp(baseRed, 0, 0.50);
        }
        damageOverlay.style.opacity = baseRed.toFixed(3);

        // screen shake from low HP / high insanity
        let shakeExtra = 0;
        if(ins > 105) shakeExtra += ((ins - 105) / 45) * 2.6;
        if(hp < 70)  shakeExtra += ((70 - hp) / 70) * 3.2;
        shakeExtra = clamp(shakeExtra, 0, 6.5);

        this._jitterX = (Math.random()-0.5) * shakeExtra;
        this._jitterY = (Math.random()-0.5) * shakeExtra;
    },

    updateInsanityFX() {
        const ins = this.player.insanity;

        if (this.player.meltdown && this.player.meltdown.active && !this.level.isTutorial) {
            // phrase cycling handled in update() for 0.2s rate
            insanityOverlay.style.opacity = 0.75;
            return;
        }

        if (ins > 100) {
            const t = (ins - 100) / (this.player.maxInsanity - 100);
            insanityOverlay.style.opacity = Math.min(0.75, 0.10 + t * 0.65);

            if (this._insanityPhraseHide > 0) {
                this._insanityPhraseHide--;
                if(this._insanityPhraseHide === 0) insanityPhraseEl.style.opacity = 0;
            } else {
                this._insanityPhraseTimer--;
                if (this._insanityPhraseTimer <= 0) {
                    insanityPhraseEl.innerText = this._insanityPhrases[Math.floor(Math.random()*this._insanityPhrases.length)];
                    insanityPhraseEl.style.opacity = 1;
                    this._insanityPhraseHide = 110;
                    this._insanityPhraseTimer = 140 + Math.floor(Math.random()*140);
                }
            }
        } else {
            insanityOverlay.style.opacity = 0;
            if(!this._meltdownTextShown) insanityPhraseEl.style.opacity = 0;
            this._insanityPhraseTimer = 60;
            this._insanityPhraseHide = 0;
        }
    },

    dropGlowstick() {
        const hall = this.level.getCurrentHall();
        if(!hall.glowsticks) hall.glowsticks = [];
        const g = new Glowstick(this.player.x + this.player.w/2 - 7, this.player.y + 12);
        hall.glowsticks.push(g);
        AudioSys.pickup();
    },

    update() {
        window.scrollTo(0,0);
        this.frame++;

        const hall = this.level.getCurrentHall(); if(!hall) throw new Error("Null Hall");
        const obstacles = [...hall.crates];

        if (this.level.isTutorial && hall.tutorialLight) hall.tutorialLight.update(this.player);

        // update glowsticks (persist per hall)
        if(!hall.glowsticks) hall.glowsticks = [];
        for(const g of hall.glowsticks) g.update(obstacles);

        this.player.update(obstacles);
        hall.enemies.forEach(e => e.update(hall, this.player));

        this.drops = hall.drops;

        // Meltdown: cycle random phrases every 0.2s until death
        if(this.player.meltdown && this.player.meltdown.active && !this.level.isTutorial && this._meltdownTextShown) {
            this._meltdownTick++;
            if(this._meltdownTick % 12 === 0) { // ~0.2s
                insanityPhraseEl.innerText = this._meltdownPhrases[Math.floor(Math.random()*this._meltdownPhrases.length)];
            }
        }

        // Drop glowstick (edge-triggered)
        Input.poll();
        if(!this.player.dead && !this.player.meltdown.active) {
            if (Input.active.glow && !this.prevGlow) this.dropGlowstick();
        }
        this.prevGlow = Input.active.glow;

        // unified interaction list (doors + items + glowsticks)
        let actionList = [];
        let nearDoor = null;
        for(const d of hall.doors) { if (rectIntersect(this.player, d)) { nearDoor = d; break; } }
        if (nearDoor) actionList.push({ kind:'door', door: nearDoor });

        const nearbyItems = this.drops.filter(d => rectIntersect(this.player, d));
        for(const it of nearbyItems) actionList.push({ kind:'item', item: it });

        const nearbyGlow = hall.glowsticks.filter(g => rectIntersect(this.player, g.getRect()));
        for(const g of nearbyGlow) actionList.push({ kind:'glow', glow: g });

        if (actionList.length > 0) {
            if (Input.active.tab && !this.prevTab) this.itemSelectionIndex = (this.itemSelectionIndex + 1) % actionList.length;
            if (this.itemSelectionIndex >= actionList.length) this.itemSelectionIndex = 0;

            const cycleKey = (Input.mode === 'PC') ? "[Q]" : (Input.mode==='GAMEPAD') ? "[Y]" : "[Q]";
            const useKey = (Input.mode === 'PC') ? "[E]" : (Input.mode==='GAMEPAD') ? "[LB]" : "[USE]";

            const list = actionList.map((a, idx) => {
                const prefix = (idx === this.itemSelectionIndex) ? "> " : "  ";
                if (a.kind === 'door') {
                    if (a.door.isExit) {
                        if(a.door.locked && !this.player.hasKeycard) return prefix + "EXIT (LOCKED)";
                        if(a.door.locked) return prefix + "UNLOCK EXIT";
                        return prefix + "ESCAPE";
                    }
                    return prefix + `ENTER SECTOR ${a.door.dest}`;
                }
                if (a.kind === 'glow') return prefix + "GLOWSTICK";
                return prefix + a.item.name;
            }).join('\n');

            let promptText = `${cycleKey} CYCLE | ${useKey} SELECT\n${list}`;

            if (Input.active.interact && !this.prevInteract) {
                const sel = actionList[this.itemSelectionIndex];
                if (sel.kind === 'door') {
                    const d = sel.door;
                    if (d.isExit) {
                        if(d.locked) { if(this.player.hasKeycard) { d.locked = false; AudioSys.pickup(); } else AudioSys.deny(); }
                        else this.level.switchHall(d.dest);
                    } else {
                        this.level.switchHall(d.dest);
                    }
                } else if (sel.kind === 'glow') {
                    // pick up glowstick (remove from hall)
                    const idx = hall.glowsticks.indexOf(sel.glow);
                    if(idx > -1) hall.glowsticks.splice(idx, 1);
                    AudioSys.pickup();
                } else {
                    const selectedItem = sel.item;
                    if (selectedItem.type === 'keycard') {
                        this.player.hasKeycard = true;
                        document.getElementById('hud-key').style.display = 'block';
                        AudioSys.pickup();
                        let globalIdx = hall.drops.indexOf(selectedItem);
                        if(globalIdx > -1) hall.drops.splice(globalIdx, 1);
                    } else {
                        if (this.player.weapon.type !== 'melee') hall.drops.push(new Item(this.player.weapon.type, this.player.x, this.player.y));
                        this.player.weapon = new Weapon(selectedItem.type);
                        AudioSys.pickup();
                        let globalIdx = hall.drops.indexOf(selectedItem);
                        if(globalIdx > -1) hall.drops.splice(globalIdx, 1);
                    }
                }
            }

            uiPrompt.style.display = 'block';
            uiPrompt.innerText = promptText;
        } else {
            uiPrompt.style.display = 'none';
        }

        this.prevInteract = Input.active.interact;
        this.prevTab = Input.active.tab;

        // camera follow
        let viewW = canvas.width / CONSTANTS.ZOOM; let viewH = canvas.height / CONSTANTS.ZOOM;
        let tx = this.player.x - viewW / 2; let ty = this.player.y - viewH / 2;
        if(Input.mode === 'PC') { tx += (Input.mouse.x - viewW/2)*0.2; ty += (Input.mouse.y - viewH/2)*0.2; }
        tx = Math.max(0, Math.min(tx, hall.width - viewW)); ty = Math.max(-100, Math.min(ty, 600 - viewH + 50));
        this.camera.x += (tx - this.camera.x) * 0.1; this.camera.y += (ty - this.camera.y) * 0.1;

        // overlays + jitter shake
        this.updateOverlaysAndShake();
        if (this.camera.shake > 0) { this.camera.x += (Math.random()-0.5)*this.camera.shake; this.camera.y += (Math.random()-0.5)*this.camera.shake; this.camera.shake *= 0.9; }
        if(this._jitterX || this._jitterY) { this.camera.x += this._jitterX; this.camera.y += this._jitterY; }

        // particles
        this.particles.forEach((p, i) => { p.update(); if (p.life <= 0) this.particles.splice(i, 1); });

        if (this.player.dead && !this.level.isTutorial) setTimeout(() => this.gameOver(), 1000);

        this.updateHUD();
        this.updateInsanityFX();

        if (this.player.dead) document.getElementById('hud-key').style.display = 'none';
    },

    updateHUD() {
        const hp = Math.ceil(this.player.health);
        document.getElementById('hud-health').innerText = `HP: ${hp}%`;
        document.getElementById('hud-health').style.color = hp < 30 ? 'red' : '#d32f2f';
        document.getElementById('hud-weapon').innerText = `WEP: ${this.player.weapon.name}`;
        let ammo = (this.player.weapon.type === 'melee' || this.player.weapon.type === 'knife') ? '--' : `${this.player.weapon.ammo}/${this.player.weapon.maxAmmo}`;
        if(this.player.weapon.reloading > 0) ammo = "RLD...";
        document.getElementById('hud-ammo').innerText = `AMMO: ${ammo}`;
        const ins = Math.ceil(this.player.insanity);
        document.getElementById('hud-insanity').innerText = `INS: ${ins}%`;
    },

    draw() {
        const hall = this.level.getCurrentHall(); const cx = this.camera.x; const cy = this.camera.y;

        ctx.save(); ctx.scale(CONSTANTS.ZOOM, CONSTANTS.ZOOM); ctx.translate(-cx, -cy);
        ctx.fillStyle = '#111'; ctx.fillRect(cx, cy, canvas.width/CONSTANTS.ZOOM, canvas.height/CONSTANTS.ZOOM);

        ctx.fillStyle = '#263238'; for(let x=0; x<hall.width; x+=300) ctx.fillRect(x, 0, 40, 600);

        hall.doors.forEach(d => {
            ctx.fillStyle = d.locked ? '#b71c1c' : '#333'; ctx.fillRect(d.x, d.y, d.w, d.h);
            if(d.isExit) { ctx.fillStyle = '#f00'; ctx.fillRect(d.x+10, d.y+10, 5, 5); }
        });

        ctx.fillStyle = '#4e342e';
        hall.crates.forEach(c => { ctx.fillRect(c.x, c.y, c.w, c.h); ctx.strokeStyle = '#3e2723'; ctx.strokeRect(c.x, c.y, c.w, c.h); });

        hall.drops.forEach(d => { ctx.fillStyle = (d.type === 'keycard') ? '#00e676' : (d.type === 'knife') ? '#cfd8dc' : '#90a4ae'; ctx.fillRect(d.x, d.y, d.w, d.h); });

        // glowsticks
        if(!hall.glowsticks) hall.glowsticks = [];
        for(const g of hall.glowsticks) g.draw(ctx);

        if (this.level.isTutorial && hall.tutorialLight) hall.tutorialLight.draw(ctx);

        hall.enemies.forEach(e => e.drawBody(ctx));
        this.player.drawBody(ctx);

        this.particles.forEach(p => p.draw(ctx));

        if(this.level.isTutorial) {
            ctx.fillStyle = '#fff'; ctx.font = "bold 18px monospace"; ctx.textAlign = "center";
            let mvKey = (Input.mode==='PC') ? "WASD" : (Input.mode==='GAMEPAD') ? "LEFT STICK" : "LEFT STICK";
            let lkKey = (Input.mode==='PC') ? "MOUSE" : (Input.mode==='GAMEPAD') ? "RIGHT STICK" : "RIGHT STICK";
            let jumpKey = (Input.mode==='PC') ? "SPACE" : (Input.mode==='GAMEPAD') ? "A" : "JUMP";
            let crouchKey = (Input.mode==='PC') ? "C" : (Input.mode==='GAMEPAD') ? "B" : "CRCH";
            let useKey = (Input.mode==='PC') ? "E" : (Input.mode==='GAMEPAD') ? "LB" : "USE";
            let cycleKey = (Input.mode==='PC') ? "Q" : (Input.mode==='GAMEPAD') ? "Y" : "Q";
            let rldKey = (Input.mode==='PC') ? "R" : (Input.mode==='GAMEPAD') ? "X" : "RLD";
            let fireKey = (Input.mode==='PC') ? "CLICK" : (Input.mode==='GAMEPAD') ? "RT" : "AIM STICK";
            let glowKey = (Input.mode==='PC') ? "F" : (Input.mode==='GAMEPAD') ? "D-PAD DOWN" : "GLOW";

            const lines = [];
            if(hall.id === 0) {
                lines.push(`${mvKey} MOVE  |  ${jumpKey} JUMP  |  ${crouchKey} CROUCH`);
                lines.push(`${lkKey} AIM/LOOK  |  LIGHT CONE = WHAT YOU SEE`);
                lines.push(`DOORS: WALK INTO DOOR + PRESS ${useKey} TO TRAVEL`);
                lines.push(`GLOWSTICKS: PRESS ${glowKey} TO DROP A MARKER`);
                lines.push(`GO RIGHT TO CONTINUE`);
            } else if(hall.id === 1) {
                lines.push(`ITEMS: STAND ON THEM + PRESS ${useKey} TO PICK UP`);
                lines.push(`MULTIPLE OPTIONS: ${cycleKey} TO CYCLE, THEN ${useKey} TO SELECT`);
                lines.push(`FIRE: ${fireKey}  |  RELOAD: ${rldKey}  |  AIM: ${lkKey}`);
                lines.push(`GLOWSTICKS CAN BE PICKED UP FROM THE MENU TOO`);
                lines.push(`GO RIGHT TO CONTINUE`);
            } else if(hall.id === 2) {
                lines.push(`SCP-999: FRIENDLY. BEING NEAR IT REDUCES INSANITY FAST.`);
                lines.push(`INSANITY: GOES UP FROM HORROR (EX: SCP-173 WATCHING YOU)`);
                lines.push(`INSANITY: GOES DOWN OVER TIME. CROUCHING SPEEDS RECOVERY.`);
                lines.push(`PURPLE TINT SHOWS INSANITY RISING (0 -> 150).`);
                lines.push(`GO RIGHT TO CONTINUE`);
            } else if(hall.id === 3) {
                lines.push(`SCP-173: MOVES WHEN NOT OBSERVED.`);
                lines.push(`KEEP IT IN YOUR VIEW WHILE YOU REPOSITION.`);
                lines.push(`WHEN INSANITY > 100: RED TINT + VOICES.`);
                lines.push(`AT 150: YOU LOSE CONTROL UNTIL YOU DIE.`);
                lines.push(`GO RIGHT TO CONTINUE`);
            } else if(hall.id === 4) {
                lines.push(`COVER FIGHTING: CRATES BLOCK BULLETS (LINE OF SIGHT).`);
                lines.push(`ENEMIES WILL CROUCH/JUMP TO FLANK OR ESCAPE.`);
                lines.push(`DROP GLOWSTICKS TO MARK DOORS, DANGERS, OR YOUR PATH.`);
                lines.push(`PICK UP THE RIFLE, THEN GO RIGHT.`);
            } else if(hall.id === 5) {
                lines.push(`ESCAPE STEPS:`);
                lines.push(`1) EXPLORE SECTORS  2) FIND LEVEL 4 KEYCARD  3) UNLOCK BLAST DOOR`);
                lines.push(`PRESS ${useKey} ON A LOCKED EXIT DOOR WITH KEYCARD TO UNLOCK.`);
                lines.push(`PICK UP THE KEYCARD HERE, THEN EXIT.`);
            }

            let y = 280;
            for(const ln of lines) { ctx.fillText(ln, 600, y); y += 28; }
        }

        ctx.fillStyle = '#000'; ctx.fillRect(0, 600, hall.width, 200);
        ctx.strokeStyle = '#333'; ctx.beginPath(); ctx.moveTo(0,600); ctx.lineTo(hall.width, 600); ctx.stroke();
        ctx.restore();

        // shadows
        shadowCtx.save(); shadowCtx.clearRect(0, 0, shadowCanvas.width, shadowCanvas.height);
        shadowCtx.fillStyle = 'rgba(0, 0, 0, 0.98)'; shadowCtx.fillRect(0, 0, shadowCanvas.width, shadowCanvas.height);
        shadowCtx.globalCompositeOperation = 'destination-out';

        const renderLightCone = (originX, originY, angle, range, spread) => {
            let points = [{x: originX, y: originY}];
            let rays = 80; let step = (spread * 2) / rays;
            for(let a = angle - spread; a <= angle + spread; a += step) {
                let dx = Math.cos(a); let dy = Math.sin(a);
                let closestDist = range;
                if (dy > 0) { let d = (600 - originY) / dy; if(d < closestDist) closestDist = d; }
                else if (dy < 0) { let d = (0 - originY) / dy; if(d < closestDist) closestDist = d; }
                for(let c of hall.crates) {
                     let marchX = originX; let marchY = originY;
                     for(let m=0; m<closestDist; m+=15) {
                         marchX += dx * 15; marchY += dy * 15;
                         if (marchX > c.x && marchX < c.x + c.w && marchY > c.y && marchY < c.y + c.h) { closestDist = m + 15; break; }
                     }
                }
                points.push({ x: originX + dx * closestDist, y: originY + dy * closestDist });
            }
            shadowCtx.beginPath(); shadowCtx.moveTo(points[0].x - cx, points[0].y - cy);
            for(let i=1; i<points.length; i++) shadowCtx.lineTo(points[i].x - cx, points[i].y - cy);
            shadowCtx.closePath(); shadowCtx.fill();
        };

        renderLightCone(this.player.x+10, this.player.y+15, this.player.aimAngle, 550, 0.55);
        shadowCtx.beginPath(); shadowCtx.arc(this.player.x + 10 - cx, this.player.y + 20 - cy, 60, 0, Math.PI*2); shadowCtx.fill();

        if (this.level.isTutorial && hall.tutorialLight) {
            shadowCtx.beginPath();
            shadowCtx.arc(hall.tutorialLight.x - cx, hall.tutorialLight.y - cy, 260, 0, Math.PI*2);
            shadowCtx.fill();
        }

        shadowCtx.restore();
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.drawImage(shadowCanvas, 0, 0, canvas.width, canvas.height);
        ctx.restore();
    },

    loop() {
        if(!this.running) return;
        try { this.update(); this.draw(); requestAnimationFrame(this.loop); } catch(e) { this.handleError(e); }
    }
};

function resizeScrollLock(){ window.scrollTo(0,0); }
setInterval(resizeScrollLock, 60);

// Help popup hooks
helpBtn.addEventListener('click', () => {
    Game.refreshHelpText();
    helpOverlay.style.display = (helpOverlay.style.display === 'block') ? 'none' : 'block';
});
helpOverlay.addEventListener('click', (e) => { if(e.target === helpOverlay) helpOverlay.style.display = 'none'; });
helpClose.addEventListener('click', () => helpOverlay.style.display = 'none');

window.randomizeSeed = function() { document.getElementById('seedInput').value = CONSTANTS.SEEDS[Math.floor(Math.random()*CONSTANTS.SEEDS.length)]; };
randomizeSeed();
Input.init();
Game.loop = Game.loop.bind(Game);
window.startGame = function(mode) { Game.start(mode); };
</script>
</body>
