<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Protocol: BREACH // Containment</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; color: #ccc; font-family: 'Courier New', Courier, monospace; overflow: hidden; user-select: none; touch-action: none; }
        #game-container { position: fixed; inset: 0; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background: #050505; }
        canvas { display: block; background: #000; }

        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .hud-text { font-size: 20px; font-weight: bold; text-shadow: 2px 2px 0 #000; margin-bottom: 8px; position: absolute; left: 20px; }
        #hud-health { top: 20px; color: #d32f2f; }
        #hud-weapon { top: 50px; color: #ffa000; }
        #hud-ammo { top: 80px; color: #fff; }
        #hud-key { top: 110px; color: #00e676; display: none; }
        #hud-insanity { top: 140px; color: #9c27b0; }

        #error-log { position: absolute; top: 10px; right: 10px; color: #ff5252; font-size: 10px; background: rgba(0,0,0,0.9); padding: 5px; border: 1px solid #ff5252; display: none; z-index: 100; max-width: 300px; white-space: pre-wrap; text-align: left; }

        /* Interaction prompt moved to bottom with padding and auto-grow upward */
        #interaction-prompt {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 10px;
            color: #fff;
            font-size: 18px;
            background: rgba(0,0,0,0.85);
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 4px;
            display: none;
            z-index: 20;
            text-align: center;
            white-space: pre-line;
            max-width: min(92vw, 720px);
            max-height: 46vh;
            overflow: hidden;
        }

        #menu-overlay { position: absolute; width: 100%; height: 100%; background: #080808; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 30; }
        h1 { color: #d32f2f; text-transform: uppercase; letter-spacing: 5px; margin-bottom: 10px; text-shadow: 0 0 10px #d32f2f; font-size: 40px; text-align: center; }
        .btn { background: #111; border: 1px solid #444; color: #eee; padding: 15px 30px; margin: 5px; cursor: pointer; font-family: inherit; font-size: 16px; min-width: 200px; transition: 0.2s; }
        .btn:hover { background: #d32f2f; border-color: #f44336; color: #fff; box-shadow: 0 0 15px #d32f2f; }

        .seed-container { display: flex; align-items: center; margin-top: 15px; gap: 5px; }
        input { background:#111; border:1px solid #333; color:#888; padding:8px; width:150px; text-align:center; font-family: inherit; }
        .icon-btn { padding: 8px 12px; min-width: auto; font-weight: bold; }
        .control-select { margin-top: 10px; text-align: center; color: #666; }
        select { background: #111; color: #eee; border: 1px solid #444; padding: 5px; font-family: inherit; margin-left: 10px; }

        /* Health overlay (red) */
        #damage-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; background: rgba(180, 0, 0, 1); transition: opacity 0.08s; opacity: 0; z-index: 5; mix-blend-mode: multiply; }
        /* Insanity FX */
        #insanity-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; background: rgba(180, 0, 0, 0.35); opacity: 0; transition: opacity 0.15s; z-index: 6; mix-blend-mode: multiply; }
        #purple-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; background: rgba(156, 39, 176, 1); opacity: 0; transition: opacity 0.10s; z-index: 4; mix-blend-mode: multiply; }

        #insanity-phrase { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; color: #ffb3b3; font-weight: bold; font-size: 22px; text-shadow: 2px 2px 0 #000; opacity: 0; transition: opacity 0.12s; z-index: 22; white-space: nowrap; }

        #touch-controls { display: none; position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 25; }
        .touch-zone { pointer-events: auto; position: absolute; bottom: 20px; width: 120px; height: 120px; background: rgba(255, 255, 255, 0.1); border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.2); }
        .touch-stick { position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; background: rgba(255, 255, 255, 0.3); border-radius: 50%; transform: translate(-50%, -50%); }
        #stick-left { left: 40px; } #stick-right { right: 40px; }
        .touch-btn { pointer-events: auto; position: absolute; background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%; width: 50px; height: 50px; color: #fff; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 14px; user-select: none; }
        .touch-btn:active { background: rgba(255, 255, 255, 0.4); }
        #btn-jump { bottom: 160px; right: 40px; }
        #btn-crouch { bottom: 40px; right: 180px; }
        #btn-interact { bottom: 110px; right: 180px; }
        #btn-reload { bottom: 230px; right: 40px; font-size: 12px; }
        #btn-tab { top: 20px; right: 20px; width: 40px; height: 40px; font-size: 10px; border-radius: 8px; }
        #btn-glow { bottom: 290px; right: 180px; font-size: 10px; }
        .hidden { display: none !important; }

        /* Help button + popup */
        #help-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 40;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.25);
            background: rgba(0,0,0,0.45);
            color: #fff;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            pointer-events: auto;
        }
        #help-btn:active { background: rgba(255,255,255,0.10); }

        #help-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 60;
            display: none;
            pointer-events: auto;
        }
        #help-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(92vw, 520px);
            background: rgba(0,0,0,0.92);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 8px;
            padding: 14px 14px 12px 14px;
            color: #fff;
            font-size: 14px;
            white-space: pre-line;
        }
        #help-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; }
        #help-close {
            margin-top: 12px;
            width: 100%;
            padding: 10px;
            background: #111;
            border: 1px solid #333;
            color: #fff;
            font-family: inherit;
            cursor: pointer;
        }
        #help-close:hover { background: #222; }
    </style>
</head>
<body>
<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="purple-overlay"></div>
    <div id="damage-overlay"></div>
    <div id="insanity-overlay"></div>
    <div id="insanity-phrase"></div>

    <button id="help-btn" title="Controls">?</button>
    <div id="help-overlay">
        <div id="help-box">
            <div id="help-title">Controls</div>
            <div id="help-body"></div>
            <button id="help-close">CLOSE</button>
        </div>
    </div>

    <div id="ui-layer" class="hidden">
        <div id="hud-health" class="hud-text">HP: 100%</div>
        <div id="hud-weapon" class="hud-text">WEP: FISTS</div>
        <div id="hud-ammo" class="hud-text">AMMO: --</div>
        <div id="hud-key" class="hud-text">KEYCARD: ACQUIRED</div>
        <div id="hud-insanity" class="hud-text">INS: 0%</div>
    </div>

    <div id="touch-controls">
        <div id="stick-left" class="touch-zone"><div class="touch-stick"></div></div>
        <div id="stick-right" class="touch-zone"><div class="touch-stick"></div></div>
        <div id="btn-jump" class="touch-btn">JUMP</div>
        <div id="btn-crouch" class="touch-btn">CRCH</div>
        <div id="btn-interact" class="touch-btn">USE</div>
        <div id="btn-reload" class="touch-btn">RLD</div>
        <div id="btn-glow" class="touch-btn">GLOW</div>
        <div id="btn-tab" class="touch-btn">Q</div>
    </div>

    <div id="interaction-prompt"></div>
    <div id="error-log"></div>

    <div id="menu-overlay">
        <h1>Protocol: Breach</h1>
        <p style="color:#aaa; text-align: center; margin-bottom: 20px; font-size: 14px;">Secure. Contain. Protect.<br>Object Class: Keter</p>
        <button class="btn" onclick="startGame('tutorial')">TUTORIAL</button>
        <button class="btn" onclick="startGame('normal')">INITIATE RUN</button>
        <div class="seed-container">Seed: <input type="text" id="seedInput"><button class="btn icon-btn" onclick="randomizeSeed()">RND</button></div>
        <div class="control-select">Control Mode: <select id="ctrl-select" onchange="Input.setMode(this.value)"><option value="PC">Keyboard/Mouse</option><option value="TOUCH">Touchscreen</option><option value="GAMEPAD">Controller</option></select></div>
        <div id="controls-info" class="controls-info"></div>
    </div>
</div>

<script>
const CONSTANTS = { GRAVITY: 0.5, FRICTION: 0.82, ZOOM: 1.8, PLAYER_COLOR: '#e65100', SEEDS: ["KETER", "EUCLID", "SITE-19", "O5-COUNCIL", "MTF-EPSILON", "SCP-682", "REDACTED", "CHAOS", "AMNESTICS", "MEMETIC", "ANOMALY", "CONTAINMENT", "BREACH", "CLASS-D", "FEMUR-BREAKER", "SCP-096", "SCP-106", "SCP-049", "THUMNIEL", "APOLLYON"] };

const NPC_OFFENSIVE_PHRASES = [
    "He's over here!", "I see you!", "Come here!", "Move in!", "Corner him!",
    "Don't let him run!", "Get him!", "On your feet!", "Push forward!", "Found you!"
];
const NPC_RELOAD_PHRASES = [
    "Reloading. Cover me!", "Reloading!", "Need a second!", "Cover me!", "Hold them off!"
];
const NPC_FLEE_PHRASES = [
    "Please!", "I have a family!", "I'll help you!", "Stop it!", "Help me!",
    "Don't shoot!", "I don't want this!", "Back off!", "No, no, no!", "I'm sorry!",
    "Take it easy!", "I won't fight!", "Let me go!", "Please, no!", "I'm done!"
];

function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function rectIntersect(r1, r2) { return !(r2.x >= r1.x + r1.w || r2.x + r2.w <= r1.x || r2.y >= r1.y + r1.h || r2.y + r2.h <= r1.y); }
function getDistance(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }

function hexToRgb(hex){
    let h = hex.replace('#','').trim();
    if(h.length === 3) h = h.split('').map(c=>c+c).join('');
    const n = parseInt(h, 16);
    return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
}
function rgbToHex(r,g,b){
    const to = (x)=>('0'+clamp(Math.round(x),0,255).toString(16)).slice(-2);
    return '#'+to(r)+to(g)+to(b);
}
function darken(hex, amt=0.28){
    try{
        const c = hexToRgb(hex);
        return rgbToHex(c.r*(1-amt), c.g*(1-amt), c.b*(1-amt));
    } catch { return '#111'; }
}

const AudioSys = {
    ctx: null, nextStep: 0,
    master: null, dry: null, wet: null, convolver: null, delay: null, feedback: null,
    init() {
        window.AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();

        this.master = this.ctx.createGain();
        this.master.gain.value = 0.85;

        this.dry = this.ctx.createGain();
        this.dry.gain.value = 0.95;

        this.wet = this.ctx.createGain();
        this.wet.gain.value = 0.35;

        this.convolver = this.ctx.createConvolver();
        this.convolver.buffer = this._makeImpulse(1.8, 2.5);

        this.delay = this.ctx.createDelay(2.0);
        this.delay.delayTime.value = 0.12;
        this.feedback = this.ctx.createGain();
        this.feedback.gain.value = 0.28;

        this.dry.connect(this.master);
        this.wet.connect(this.convolver);
        this.convolver.connect(this.delay);
        this.delay.connect(this.master);
        this.delay.connect(this.feedback);
        this.feedback.connect(this.delay);

        this.master.connect(this.ctx.destination);
    },
    resume() { if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(()=>{}); },
    _makeImpulse(seconds, decay) {
        const rate = this.ctx.sampleRate;
        const length = Math.floor(rate * seconds);
        const impulse = this.ctx.createBuffer(2, length, rate);
        for (let ch = 0; ch < 2; ch++) {
            const data = impulse.getChannelData(ch);
            for (let i = 0; i < length; i++) {
                const t = i / length;
                data[i] = (Math.random()*2-1) * Math.pow(1 - t, decay);
            }
        }
        return impulse;
    },
    _connectToWorld(node, dryLevel=1.0, wetLevel=0.8) {
        if(!this.ctx) return;
        const dg = this.ctx.createGain(); dg.gain.value = dryLevel;
        const wg = this.ctx.createGain(); wg.gain.value = wetLevel;
        node.connect(dg); dg.connect(this.dry);
        node.connect(wg); wg.connect(this.wet);
    },
    playTone(freq, type, duration, vol=0.1, slide=0, wet=0.55) {
        if(!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        if(slide) osc.frequency.linearRampToValueAtTime(freq+slide, this.ctx.currentTime+duration);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime+duration);
        osc.connect(gain);
        this._connectToWorld(gain, 0.9, wet);
        osc.start();
        osc.stop(this.ctx.currentTime+duration);
    },
    playNoise(duration, vol=0.1, hp=60, lp=8000, wet=0.7) {
        if(!this.ctx) return;
        const bSize = Math.floor(this.ctx.sampleRate * duration);
        const b = this.ctx.createBuffer(1, bSize, this.ctx.sampleRate);
        const d = b.getChannelData(0);
        for(let i=0; i<bSize; i++) d[i] = (Math.random()*2-1) * Math.exp(-i/(bSize/4));
        const src = this.ctx.createBufferSource(); src.buffer = b;

        const hip = this.ctx.createBiquadFilter(); hip.type = 'highpass'; hip.frequency.value = hp;
        const lop = this.ctx.createBiquadFilter(); lop.type = 'lowpass'; lop.frequency.value = lp;

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime+duration);

        src.connect(hip); hip.connect(lop); lop.connect(gain);
        this._connectToWorld(gain, 0.85, wet);
        src.start();
    },
    shoot(type) {
        if(!this.ctx) return;
        if(type === 'melee' || type === 'knife') {
            this.playNoise(0.07, 0.25, 120, 2500, 0.35);
            this.playTone(140, 'triangle', 0.08, 0.12, -80, 0.35);
        } else if(type === 'pistol') {
            this.playNoise(0.12, 0.65, 90, 7000, 0.95);
            this.playNoise(0.20, 0.25, 60, 1200, 0.55);
            this.playTone(520, 'square', 0.06, 0.07, -260, 0.70);
        } else {
            this.playNoise(0.14, 0.75, 110, 8000, 1.0);
            this.playNoise(0.22, 0.30, 60, 1400, 0.6);
            this.playTone(260, 'sawtooth', 0.07, 0.08, -120, 0.75);
        }
    },
    reload(type) {
        if(!this.ctx) return;
        if(type === 'pistol') {
            this.playNoise(0.05, 0.20, 300, 4000, 0.35);
            setTimeout(()=>this.playNoise(0.06, 0.24, 200, 3500, 0.35), 120);
            setTimeout(()=>this.playTone(220, 'triangle', 0.05, 0.05, 0, 0.20), 190);
            setTimeout(()=>this.playNoise(0.08, 0.26, 250, 5200, 0.45), 260);
            setTimeout(()=>this.playNoise(0.06, 0.22, 280, 6000, 0.50), 420);
        } else if(type === 'rifle') {
            this.playNoise(0.07, 0.26, 250, 3500, 0.40);
            setTimeout(()=>this.playNoise(0.08, 0.30, 180, 2800, 0.45), 140);
            setTimeout(()=>this.playNoise(0.05, 0.20, 320, 4500, 0.40), 240);
            setTimeout(()=>this.playTone(140, 'triangle', 0.06, 0.05, 0, 0.15), 310);
            setTimeout(()=>this.playNoise(0.08, 0.28, 220, 6500, 0.55), 420);
        } else {
            this.playNoise(0.08, 0.22, 200, 2500, 0.35);
            setTimeout(() => this.playNoise(0.06, 0.18, 180, 3000, 0.35), 110);
            setTimeout(() => this.playTone(320, 'square', 0.04, 0.06, -80, 0.25), 190);
        }
    },
    step() {
        const now = Date.now();
        if(now > this.nextStep) {
            this.playNoise(0.055, 0.16, 160, 1200, 0.85);
            this.playNoise(0.10, 0.06, 120, 700, 0.95);
            this.nextStep = now + 320;
        }
    },
    hit() { this.playNoise(0.10, 0.30, 80, 900, 0.35); this.playTone(95, 'triangle', 0.09, 0.06, -40, 0.25); },
    jump() { this.playNoise(0.06, 0.18, 180, 1500, 0.25); this.playTone(120, 'sine', 0.14, 0.08, -35, 0.20); },
    pickup() { this.playTone(600, 'sine', 0.08, 0.08, 180, 0.20); },
    deny() { this.playTone(110, 'sawtooth', 0.18, 0.14, 0, 0.20); },
    heartbeat(intensity=1.0) {
        if(!this.ctx) return;
        this.playNoise(0.06, 0.22*intensity, 90, 650, 0.55);
        this.playTone(52, 'sine', 0.10, 0.06*intensity, 0, 0.35);
        setTimeout(()=>this.playNoise(0.05, 0.14*intensity, 110, 850, 0.45), 120);
        setTimeout(()=>this.playTone(46, 'sine', 0.10, 0.05*intensity, 0, 0.30), 120);
    }
};

const Input = {
    mode: 'PC',
    active: { x: 0, jump: false, crouch: false, fire: false, interact: false, tab: false, reload: false, glow: false, aimX: 0, aimY: 0 },
    keys: {}, mouse: { x: 0, y: 0, down: false }, touchSticks: { left: {x:0, y:0}, right: {x:0, y:0} }, gamepadIndex: null,
    init() {
        window.addEventListener('keydown', e => this.keys[e.code] = true);
        window.addEventListener('keyup', e => {
            this.keys[e.code] = false;
            if(e.code === 'KeyQ') {
                e.preventDefault();
                this.active.tab = true;
                setTimeout(()=>this.active.tab=false, 100);
            }
        });
        window.addEventListener('mousemove', e => { const rect = canvas.getBoundingClientRect(); this.mouse.x = (e.clientX - rect.left) / CONSTANTS.ZOOM; this.mouse.y = (e.clientY - rect.top) / CONSTANTS.ZOOM; });
        window.addEventListener('mousedown', () => this.mouse.down = true);
        window.addEventListener('mouseup', () => this.mouse.down = false);
        this.setupTouch('stick-left', (x,y) => this.touchSticks.left = {x,y});
        this.setupTouch('stick-right', (x,y) => this.touchSticks.right = {x,y});
        this.setupTouchBtn('btn-jump', 'jump');
        this.setupTouchBtn('btn-crouch', 'crouch');
        this.setupTouchBtn('btn-interact', 'interact');
        this.setupTouchBtn('btn-reload', 'reload');
        this.setupTouchBtn('btn-glow', 'glow');
        const tabBtn = document.getElementById('btn-tab');
        tabBtn.addEventListener('touchstart', (e) => { e.preventDefault(); this.active.tab = true; });
        tabBtn.addEventListener('touchend', (e) => { e.preventDefault(); this.active.tab = false; });

        window.addEventListener("gamepadconnected", e => this.gamepadIndex = e.gamepad.index);
        const saved = localStorage.getItem('breach_ctrl');
        if(saved) this.setMode(saved);
        else { if(/Android|iPhone|iPad/i.test(navigator.userAgent)) this.setMode('TOUCH'); else this.setMode('PC'); }
    },
    setMode(m) {
        this.mode = m;
        localStorage.setItem('breach_ctrl', m);
        document.getElementById('ctrl-select').value = m;
        const tUI = document.getElementById('touch-controls');
        const cInfo = document.getElementById('controls-info');
        if(m === 'TOUCH') {
            tUI.style.display = 'block';
            cInfo.innerHTML = "Left Stick: Move | Right Stick: Aim/Fire<br>Buttons: Actions";
        } else if (m === 'GAMEPAD') {
            tUI.style.display = 'none';
            cInfo.innerHTML = "Left Stick: Move | Right Stick: Aim | RT: Fire<br>A: Jump | B: Crouch | LB: Interact | X: Reload | Y: Cycle | D-Pad Down: Glowstick";
        } else {
            tUI.style.display = 'none';
            cInfo.innerHTML = "WASD: Move | Mouse: Aim/Fire<br>Space: Jump | C: Crouch | E: Interact | R: Reload | Q: Cycle | F: Glowstick";
        }
        Game.refreshHelpText();
    },
    setupTouch(id, callback) {
        const zone = document.getElementById(id);
        const stick = zone.querySelector('.touch-stick');
        let touchId = null; let startX, startY;
        zone.addEventListener('touchstart', e => { e.preventDefault(); const touch = e.changedTouches[0]; touchId = touch.identifier; startX = touch.clientX; startY = touch.clientY; });
        zone.addEventListener('touchmove', e => {
            e.preventDefault();
            for(let i=0; i<e.changedTouches.length; i++) {
                if(e.changedTouches[i].identifier === touchId) {
                    let dx = e.changedTouches[i].clientX - startX;
                    let dy = e.changedTouches[i].clientY - startY;
                    let dist = Math.min(35, Math.hypot(dx, dy));
                    let angle = Math.atan2(dy, dx);
                    let sx = Math.cos(angle) * dist;
                    let sy = Math.sin(angle) * dist;
                    stick.style.transform = `translate(calc(-50% + ${sx}px), calc(-50% + ${sy}px))`;
                    callback(sx/35, sy/35);
                }
            }
        });
        const end = (e) => {
            e.preventDefault();
            for(let i=0; i<e.changedTouches.length; i++) if(e.changedTouches[i].identifier === touchId) {
                touchId = null;
                stick.style.transform = `translate(-50%, -50%)`;
                callback(0,0);
            }
        };
        zone.addEventListener('touchend', end);
        zone.addEventListener('touchcancel', end);
    },
    setupTouchBtn(id, key) {
        const btn = document.getElementById(id);
        btn.addEventListener('touchstart', e => { e.preventDefault(); this.active[key] = true; });
        btn.addEventListener('touchend', e => { e.preventDefault(); this.active[key] = false; });
    },
    poll() {
        let gp = null;
        if(this.gamepadIndex !== null) gp = navigator.getGamepads()[this.gamepadIndex];

        if (this.mode === 'PC') {
            this.active.x = (this.keys['KeyD'] ? 1 : 0) - (this.keys['KeyA'] ? 1 : 0);
            this.active.jump = this.keys['Space'];
            this.active.crouch = this.keys['KeyC'];
            this.active.fire = this.mouse.down;
            this.active.interact = this.keys['KeyE'];
            this.active.reload = this.keys['KeyR'];
            this.active.glow = this.keys['KeyF'];
        } else if (this.mode === 'TOUCH') {
            this.active.x = (this.touchSticks.left.x > 0.3) ? 1 : (this.touchSticks.left.x < -0.3) ? -1 : 0;
            let rx = this.touchSticks.right.x, ry = this.touchSticks.right.y;
            if (Math.hypot(rx, ry) > 0.3) { this.active.aimX = rx; this.active.aimY = ry; this.active.fire = true; } else { this.active.fire = false; }
        } else if (this.mode === 'GAMEPAD' && gp) {
            let lx = gp.axes[0];
            this.active.x = (lx > 0.3) ? 1 : (lx < -0.3) ? -1 : 0;
            let rx = gp.axes[2], ry = gp.axes[3];
            if (Math.hypot(rx, ry) > 0.2) { this.active.aimX = rx; this.active.aimY = ry; }
            this.active.jump = gp.buttons[0].pressed;         // A
            this.active.crouch = gp.buttons[1].pressed;       // B
            this.active.reload = gp.buttons[2].pressed;       // X
            this.active.tab = gp.buttons[3].pressed;          // Y
            this.active.interact = gp.buttons[4].pressed;     // LB
            this.active.fire = gp.buttons[7].pressed;         // RT
            this.active.glow = gp.buttons[13] ? gp.buttons[13].pressed : false; // D-pad down
        }
    }
};

class SeededRNG {
    constructor(seed) { let h = 0xdeadbeef; for(let i=0; i<seed.length; i++) h = Math.imul(h ^ seed.charCodeAt(i), 2654435761); this.seed = (h ^ h >>> 16) >>> 0; }
    next() { this.seed = (this.seed * 9301 + 49297) % 233280; return this.seed / 233280; }
    range(min, max) { return min + this.next() * (max - min); }
    int(min, max) { return Math.floor(this.range(min, max + 1)); }
    choose(arr) { return arr[Math.floor(this.range(0, arr.length - 1))]; }
}
let RNG;

class Particle {
    constructor(x, y, color, speed, life) { this.x = x; this.y = y; this.vx = (Math.random() - 0.5) * speed; this.vy = (Math.random() - 0.5) * speed; this.color = color; this.life = life; this.maxLife = life; this.size = Math.random() * 3 + 1; }
    update() { this.x += this.vx; this.y += this.vy; this.life--; }
    draw(ctx) { ctx.globalAlpha = Math.max(0, this.life / this.maxLife); ctx.fillStyle = this.color; ctx.fillRect(this.x, this.y, this.size, this.size); ctx.globalAlpha = 1.0; }
}

class Item {

}
class Weapon {

        this.type = type; this.cooldown = 0; this.reloading = 0;

        else if(type === 'knife') { this.name = "SHIV"; this.damage = 35; this.rate = 20; this.range = 55; this.ammo=Infinity; this.maxAmmo=Infinity; }
        else if(type === 'pistol') { this.name = "G-17 PISTOL"; this.damage = 25; this.rate = 20; this.range = 450; this.maxAmmo = 12; this.ammo = 12; this.reloadTime = 60; this.spread = 0.05; }
        else if(type === 'rifle') { this.name = "MTF RIFLE"; this.damage = 18; this.rate = 6; this.range = 650; this.maxAmmo = 30; this.ammo = 30; this.reloadTime = 90; this.spread = 0.12; }
    }
}

function drawGunModel(ctx, type, reloadT=0, recoil=0) {
    const tilt = reloadT > 0 ? (0.9 - reloadT) * 0.7 : 0;
    ctx.save();
    ctx.rotate(tilt);
    const r = recoil || 0;

    if(type === 'pistol') {
        ctx.fillStyle = '#263238';
        ctx.fillRect(-r, -4, 22, 7);
        ctx.fillStyle = '#111';
        ctx.fillRect(18-r, -3, 10, 5);
        ctx.fillStyle = '#37474f';
        ctx.fillRect(6-r, 2, 8, 10);
        ctx.strokeStyle = '#111';
        ctx.lineWidth = 2;
        ctx.strokeRect(10-r, 2, 6, 6);
        if(reloadT > 0) {
            const magDrop = Math.sin(reloadT * Math.PI) * 7;
            ctx.fillStyle = '#111';
            ctx.fillRect(7-r, 12 + magDrop, 6, 10);
        }
    } else if(type === 'rifle') {
        ctx.fillStyle = '#263238';
        ctx.fillRect(-r, -4, 34, 7);
        ctx.fillStyle = '#111';
        ctx.fillRect(30-r, -3, 28, 3);
        ctx.fillStyle = '#37474f';
        ctx.fillRect(-10-r, -3, 10, 6);
        ctx.fillStyle = '#1f2a30';
        ctx.fillRect(16-r, -3, 14, 5);
        ctx.fillStyle = '#111';
        const magMove = reloadT > 0 ? Math.sin(reloadT * Math.PI) * 8 : 0;
        ctx.fillRect(12-r, 2 + magMove, 6, 12);
        ctx.fillStyle = '#000';
        ctx.fillRect(10-r, -6, 6, 2);
        if(reloadT > 0.6) {
            ctx.fillStyle = '#cfd8dc';
            ctx.fillRect(2-r, -2, 8, 2);
        }
    }
    ctx.restore();
}

/* Glowstick */
class Glowstick {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.w = 14; this.h = 4;
        this.vx = (Math.random()-0.5)*1.2;
        this.vy = -1.5;
        this.onGround = false;
        this.frozen = false;
        this.freezeTimer = 30; // 0.5s @ 60fps
        this.rot = (Math.random()-0.5)*0.6;
    }
    getRect() { return {x:this.x, y:this.y, w:this.w, h:this.h}; }
    update(obstacles) {
        if(this.frozen) return;

        this.freezeTimer--;
        this.vy += 0.45;
        this.vx *= 0.94;

        this.x += this.vx;
        for(const o of obstacles) {
            const r = this.getRect();
            if(rectIntersect(r, o)) {
                if(this.vx > 0) this.x = o.x - this.w;
                else if(this.vx < 0) this.x = o.x + o.w;
                this.vx *= -0.15;
            }
        }

        this.y += this.vy;
        this.onGround = false;

        for(const o of obstacles) {
            const r = this.getRect();
            if(!rectIntersect(r, o)) continue;
            if(this.vy > 0) { this.y = o.y - this.h; this.onGround = true; this.vy = 0; }
            else if(this.vy < 0) { this.y = o.y + o.h; this.vy = 0; }
        }
        if(this.y + this.h > 600) { this.y = 600 - this.h; this.onGround = true; this.vy = 0; }

        this.rot += this.vx * 0.02;

        if(this.freezeTimer <= 0) {
            this.frozen = true;
            this.vx = 0; this.vy = 0;
        }
    }
    draw(ctx) {
        // Green "glow" around it, without affecting the shadow mask
        ctx.save();
        ctx.globalAlpha = 0.18;
        ctx.fillStyle = '#00ff66';
        ctx.beginPath();
        ctx.ellipse(this.x + this.w/2, this.y + this.h/2, 28, 16, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 0.55;
        ctx.beginPath();
        ctx.ellipse(this.x + this.w/2, this.y + this.h/2, 16, 9, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1.0;

        ctx.translate(this.x + this.w/2, this.y + this.h/2);
        ctx.rotate(this.rot);
        ctx.fillStyle = '#00e676';
        ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h);
        ctx.fillStyle = '#007a38';
        ctx.fillRect(-this.w/2, -this.h/2, 2, this.h);
        ctx.fillRect(this.w/2-2, -this.h/2, 2, this.h);
        ctx.restore();
    }
}

/* Tutorial hanging light */
class HangingLight {
    constructor(ax, ay, len) { this.ax = ax; this.ay = ay; this.len = len; this.x = ax; this.y = ay + len; this.px = this.x; this.py = this.y; this.r = 10; }
    update(player) {
        const vx = (this.x - this.px) * 0.995;
        const vy = (this.y - this.py) * 0.995;
        this.px = this.x; this.py = this.y;
        this.x += vx; this.y += vy + 0.35;

        for(let i=0;i<6;i++) {
            const dx = this.x - this.ax;
            const dy = this.y - this.ay;
            const d = Math.max(0.0001, Math.hypot(dx, dy));
            const diff = (d - this.len) / d;
            this.x -= dx * diff;
            this.y -= dy * diff;
        }

        if(player && !player.dead) {
            const pr = {x:player.x, y:player.y, w:player.w, h:player.h};
            const nx = clamp(this.x, pr.x, pr.x + pr.w);
            const ny = clamp(this.y, pr.y, pr.y + pr.h);
            const dx = this.x - nx, dy = this.y - ny;
            const d2 = dx*dx + dy*dy;
            if(d2 < (this.r+2)*(this.r+2)) {
                const d = Math.max(0.0001, Math.sqrt(d2));
                const ux = dx / d, uy = dy / d;
                this.x += ux * 1.8; this.y += uy * 1.8;
                this.px -= ux * 2.6; this.py -= uy * 2.6;
            }
        }
    }
    draw(ctx) {
        ctx.save();
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(this.ax, this.ay); ctx.lineTo(this.x, this.y); ctx.stroke();

        ctx.globalAlpha = 0.25;
        ctx.fillStyle = '#fff2a8';
        ctx.beginPath(); ctx.arc(this.x, this.y, 55, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1.0;

        ctx.fillStyle = '#cfd8dc';
        ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#111';
        ctx.fillRect(this.x-4, this.y-this.r-6, 8, 6);
        ctx.restore();
    }
}

class Entity {
    constructor(x, y, w, h) {
        this.x = x; this.y = y; this.w = w; this.h = h;
        this.vx = 0; this.vy = 0; this.onGround = false;
        this.color = '#fff'; this.facing = 1; this.aimAngle = 0;
        this.health = 100; this.maxHealth = 100; this.dead = false;
        this.attackAnim = 0; this.aiType = -1; this.lastHitFrame = -999;
        this.baseSpeed = 1.0;
        this.speechText = ""; this.speechTimer = 0;
    }
    setSpeech(text, frames) { this.speechText = text; this.speechTimer = frames; }
    getSpeed() {
        let spd = this.baseSpeed;
        if (Game.frame - this.lastHitFrame < 180) spd *= 1.25;
        else spd *= Math.max(0.5, this.health / this.maxHealth);

        if(this.health < this.maxHealth * 0.5) {
            spd *= 0.70;
            const phase = (Game.frame % 26);
            if(phase < 10) spd *= 0.82;
        }
        return spd;
    }
    applyPhysics(obstacles) {
        const prevX = this.x, prevY = this.y;
        this.vy += CONSTANTS.GRAVITY;
        this.vx *= CONSTANTS.FRICTION;

        this.x += this.vx;
        for (let obs of obstacles) {
            if (rectIntersect(this, obs)) {
                if (this.vx > 0) this.x = obs.x - this.w;
                else if (this.vx < 0) this.x = obs.x + obs.w;
                this.vx = 0;
            }
        }

        this.y += this.vy;
        this.onGround = false;
        for (let obs of obstacles) {
            if (!rectIntersect(this, obs)) continue;
            const prevBottom = prevY + this.h;
            const prevTop = prevY;

            if (this.vy > 0 && prevBottom <= obs.y + 0.5) {
                this.y = obs.y - this.h;
                this.onGround = true;
                this.vy = 0;
            } else if (this.vy < 0 && prevTop >= obs.y + obs.h - 0.5) {
                this.y = obs.y + obs.h;
                this.vy = 0;
            } else {
                if (prevX + this.w <= obs.x + 0.5) this.x = obs.x - this.w;
                else if (prevX >= obs.x + obs.w - 0.5) this.x = obs.x + obs.w;
                this.vx = 0;
            }
        }
        if(this.y + this.h > 600) { this.y = 600 - this.h; this.onGround = true; this.vy = 0; }
    }
    takeDamage(amt) {
        this.health -= amt;
        this.lastHitFrame = Game.frame;
        AudioSys.hit();
        for(let i=0; i<4; i++) Game.particles.push(new Particle(this.x+this.w/2, this.y+this.h/2, '#b71c1c', 4, 20));
        if (this.health <= 0) { this.health = 0; this.die(); }
    }
    die() { this.dead = true; if (this.weapon && this.weapon.type !== 'melee') Game.drops.push(new Item(this.weapon.type, this.x, this.y + this.h - 10)); }
    drawSpeech(ctx) {
        if(!this.speechText || this.speechTimer <= 0) return;
        const cx = this.x + this.w/2;
        const y = this.y - 10;
        ctx.save();
        ctx.font = "bold 12px monospace";
        ctx.textAlign = "center";
        ctx.fillStyle = "rgba(0,0,0,0.75)";
        const w = ctx.measureText(this.speechText).width + 12;
        ctx.fillRect(cx - w/2, y - 14, w, 16);
        ctx.strokeStyle = "rgba(255,255,255,0.25)";
        ctx.strokeRect(cx - w/2, y - 14, w, 16);
        ctx.fillStyle = "#fff";
        ctx.fillText(this.speechText, cx, y - 2);
        ctx.restore();
    }

    drawBody(ctx) {
        if(this.dead) return;

        // SCP-173
        if (this.aiType === 3) {
            ctx.fillStyle = '#d7ccc8';
            ctx.beginPath(); ctx.ellipse(this.x+this.w/2, this.y+this.h/2-10, 12, 12, 0, 0, Math.PI*2); ctx.fill();
            ctx.ellipse(this.x+this.w/2, this.y+this.h/2+15, 10, 18, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#111'; ctx.fillRect(this.x+this.w/2-5, this.y+this.h/2-14, 3, 3); ctx.fillRect(this.x+this.w/2+2, this.y+this.h/2-14, 3, 3);
            ctx.fillStyle = '#b71c1c'; ctx.fillRect(this.x+this.w/2-2, this.y+this.h/2-8, 4, 4);
            if(this.caged) { ctx.strokeStyle='red'; ctx.lineWidth=2; ctx.strokeRect(this.x-5, this.y-5, this.w+10, this.h+10); for(let i=0;i<this.h+10;i+=10) { ctx.beginPath(); ctx.moveTo(this.x-5, this.y-5+i); ctx.lineTo(this.x+this.w+5, this.y-5+i); ctx.stroke(); } }
            this.drawSpeech(ctx);
            return;
        }
        // SCP-999
        if (this.aiType === 4) {
            ctx.fillStyle = '#ffcc80';
            ctx.beginPath(); ctx.arc(this.x + this.w/2, this.y + this.h - 10, 15, Math.PI, 0); ctx.fill();
            ctx.fillRect(this.x, this.y + this.h - 10, this.w, 10);
            this.drawSpeech(ctx);
            return;
        }

        // torso + legs
        const torso = {x:this.x+2, y:this.y+12, w:this.w-4, h:this.h-14};
        ctx.fillStyle = darken(this.color, 0.12);
        ctx.fillRect(torso.x, torso.y, torso.w, torso.h);
        ctx.fillStyle = this.color;
        ctx.fillRect(torso.x+1, torso.y+1, torso.w-2, torso.h-2);

        ctx.fillStyle = darken(this.color, 0.22);
        ctx.fillRect(this.x+3, this.y+this.h-14, 6, 12);
        ctx.fillRect(this.x+this.w-9, this.y+this.h-14, 6, 12);

        // head
        ctx.fillStyle = '#ffccbc';
        ctx.beginPath();
        ctx.arc(this.x + this.w/2, this.y + 7, 6, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#111';
        ctx.fillRect(this.x + this.w/2 - 3, this.y + 5, 2, 2);
        ctx.fillRect(this.x + this.w/2 + 1, this.y + 5, 2, 2);

        // uniform accents by type
        if (this.aiType === 0) { ctx.fillStyle = '#ef6c00'; ctx.fillRect(this.x+2, this.y+18, this.w-4, 2); }
        else if (this.aiType === 1) { ctx.fillStyle = '#111'; ctx.fillRect(this.x+2, this.y+26, this.w-4, 3); }
        else if (this.aiType === 2) { ctx.fillStyle = '#111'; ctx.fillRect(this.x+1, this.y+20, this.w-2, 4); }

        // helmets
        if (this.aiType === 1) { ctx.fillStyle = '#222'; ctx.fillRect(this.x+4, this.y+0, this.w-8, 4); }
        else if (this.aiType === 2) { ctx.fillStyle = '#111'; ctx.fillRect(this.x+3, this.y-1, this.w-6, 6); }

        // body armour for security & mtf
        if (this.aiType === 1 || this.aiType === 2) {
            const vest = (this.aiType === 2) ? '#101820' : '#1a1f26';
            const plate = (this.aiType === 2) ? '#0b0f14' : '#111';
            ctx.save();
            ctx.globalAlpha = 0.95;
            // vest body
            ctx.fillStyle = vest;
            ctx.fillRect(this.x+3, this.y+18, this.w-6, 18);
            // plates
            ctx.fillStyle = plate;
            ctx.fillRect(this.x+5, this.y+20, this.w-10, 6);
            ctx.fillRect(this.x+5, this.y+28, this.w-10, 6);
            // shoulder pads
            ctx.fillStyle = plate;
            ctx.fillRect(this.x+1, this.y+18, 4, 6);
            ctx.fillRect(this.x+this.w-5, this.y+18, 4, 6);
            // straps
            ctx.strokeStyle = '#2b2f36';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(this.x+6, this.y+18); ctx.lineTo(this.x+6, this.y+36);
            ctx.moveTo(this.x+this.w-6, this.y+18); ctx.lineTo(this.x+this.w-6, this.y+36);
            ctx.stroke();
            ctx.restore();
        }

        // weapon arm + gun
        let armX = this.x + this.w / 2; let armY = this.y + this.h / 3 + 2;
        let recoil = Math.sin(this.attackAnim * Math.PI) * 8;
        const reloadT = (this.weapon && this.weapon.reloading > 0 && this.weapon.reloadTime) ? (this.weapon.reloading / this.weapon.reloadTime) : 0;

        ctx.save(); ctx.translate(armX, armY);
        const aim = this.aimAngle;
        ctx.rotate(aim);
        const flip = Math.cos(aim) < 0;
        if(flip) ctx.scale(1, -1);

        ctx.fillStyle = this.color;

        if (this.weapon && (this.weapon.type === 'melee' || this.weapon.type === 'knife')) {
            let punch = Math.sin(this.attackAnim * Math.PI) * 15;
            ctx.fillRect(0 + punch, -3, 12, 6);
            ctx.fillStyle = '#ffccbc'; ctx.fillRect(10 + punch, -3, 4, 6);
            if(this.weapon.type === 'knife') { ctx.fillStyle = '#cfd8dc'; ctx.fillRect(12+punch, -2, 10, 3); }
        } else if (this.weapon) {
            const rTilt = reloadT > 0 ? (0.3 + 0.3*Math.sin(reloadT*Math.PI)) : 0;
            ctx.save();
            ctx.translate(-recoil, 0);
            ctx.rotate(rTilt);
            ctx.fillStyle = this.color;
            ctx.fillRect(0, -3, 12, 6);
            ctx.translate(12, 0);
            drawGunModel(ctx, this.weapon.type, reloadT, recoil*0.2);
            ctx.restore();
        }
        ctx.restore();

        this.drawSpeech(ctx);
    }
}

class Player extends Entity {
    constructor(x, y) {
        super(x, y, 20, 48);
        this.color = CONSTANTS.PLAYER_COLOR;
        this.maxHealth = 150; this.health = 150;
        this.weapon = new Weapon('melee');
        this.hasKeycard = false;
        this.baseSpeed = 4.0;
        this.insanity = 0;
        this.maxInsanity = 150;
        this.lastEvent = -999;

        this.meltdown = { active: false, phase: 0, timer: 0, lastHall: null, justFled999: false, path: null, targetEnemy: null };

        this.glowstickCarry = 0; // kept for future, not required
    }

    setCrouch(on) {
        if(on) { if(this.h === 48) this.y += 16; this.h = 32; }
        else { if(this.h === 32) this.y -= 16; this.h = 48; }
    }
    tryHopOver(obstacles, dir) {
        if(!this.onGround) return false;
        const probe = { x: this.x + (dir > 0 ? this.w : -8), y: this.y + this.h - 18, w: 8, h: 18 };
        for(const c of obstacles) {
            if(rectIntersect(probe, c)) {
                if(c.h <= 100) { this.vy = -10.4; AudioSys.jump(); return true; }
            }
        }
        return false;
    }

    startMeltdown() {
        if(this.meltdown.active || this.dead || Game.level.isTutorial) return;
        this.meltdown.active = true;
        this.meltdown.phase = 1;
        this.meltdown.timer = 6; // 0.1s
        this.meltdown.lastHall = Game.level.currentHallIndex;
        this.meltdown.path = null;
        this.meltdown.targetEnemy = null;
        this.meltdown.justFled999 = false;

        Game.showMeltdownText(true);
    }

    updateMeltdown(obstacles) {
        const hall = Game.level.getCurrentHall();

        if(this.meltdown.phase === 1) {
            this.vx = 0;
            this.setCrouch(false);
            this.meltdown.timer--;
            this.applyPhysics(obstacles);
            if(this.meltdown.timer <= 0) this.meltdown.phase = 2;
            return;
        }

        const pickLocalTarget = () => {
            let best = null, bestD = Infinity;
            for(const e of hall.enemies) {
                if(e.dead) continue;
                if(e.aiType === 4) continue;
                const d = getDistance(this.x, this.y, e.x, e.y);
                if(d < bestD) { bestD = d; best = e; }
            }
            return best;
        };

        // If 999 is present, flee through nearest door first (once), then proceed
        if(!this.meltdown.justFled999) {
            const has999 = hall.enemies.some(e => !e.dead && e.aiType === 4);
            if(has999) {
                let bestDoor = null, bestD = Infinity;
                for(const d of hall.doors) {
                    if(d.dest === -99) continue;
                    const dx = (d.x + d.w/2) - (this.x + this.w/2);
                    const dy = (d.y + d.h/2) - (this.y + this.h/2);
                    const dist = Math.hypot(dx, dy);
                    if(dist < bestD) { bestD = dist; bestDoor = d; }
                }
                if(bestDoor) {
                    const goalX = bestDoor.x + bestDoor.w/2;
                    const dir = Math.sign(goalX - (this.x + this.w/2));
                    this.setCrouch(false);
                    this.vx = dir * (this.getSpeed() * 1.25);
                    if(Math.abs(this.vx) > 0.1 && this.onGround) AudioSys.step();
                    if(dir !== 0) this.facing = dir;
                    this.aimAngle = (dir >= 0) ? 0 : Math.PI;
                    if(Math.abs(goalX - (this.x + this.w/2)) < 25) this.tryHopOver(obstacles, dir);
                    this.applyPhysics(obstacles);
                    if(rectIntersect(this, bestDoor)) {
                        const from = Game.level.currentHallIndex;
                        Game.level.switchHall(bestDoor.dest);
                        this.meltdown.lastHall = from;
                        this.meltdown.justFled999 = true;
                    }
                    return;
                }
            } else {
                this.meltdown.justFled999 = true;
            }
        }

        // Find any hall with alive non-999 via BFS
        const ensurePathToAlive = () => {
            const start = Game.level.currentHallIndex;
            const local = pickLocalTarget();
            if(local) { this.meltdown.path = [start]; this.meltdown.targetEnemy = local; return; }

            const q = [start];
            const prev = new Map();
            prev.set(start, null);

            while(q.length) {
                const u = q.shift();
                const H = Game.level.halls[u];
                if(!H) continue;

                if(u !== start) {
                    let found = false;
                    for(const e of H.enemies) { if(!e.dead && e.aiType !== 4) { found = true; break; } }
                    if(found) {
                        const path = [];
                        let cur = u;
                        while(cur !== null) { path.push(cur); cur = prev.get(cur); }
                        path.reverse();
                        this.meltdown.path = path;
                        this.meltdown.targetEnemy = null;
                        return;
                    }
                }

                for(const d of H.doors) {
                    if(d.dest === -99) continue;
                    const v = d.dest;
                    if(!prev.has(v)) { prev.set(v, u); q.push(v); }
                }
            }

            this.meltdown.path = null;
            this.meltdown.targetEnemy = null;
        };

        ensurePathToAlive();

        const roam = () => {
            let bestDoor = null, bestD = Infinity;
            for(const d of hall.doors) {
                if(d.dest === -99) continue;
                if(this.meltdown.lastHall !== null && d.dest === this.meltdown.lastHall) continue;
                const dist = Math.abs((d.x + d.w/2) - (this.x + this.w/2));
                if(dist < bestD) { bestD = dist; bestDoor = d; }
            }
            if(!bestDoor) {
                for(const d of hall.doors) {
                    if(d.dest === -99) continue;
                    const dist = Math.abs((d.x + d.w/2) - (this.x + this.w/2));
                    if(dist < bestD) { bestD = dist; bestDoor = d; }
                }
            }
            if(!bestDoor) { this.vx = 0; this.applyPhysics(obstacles); return; }

            const goalX = bestDoor.x + bestDoor.w/2;
            const dir = Math.sign(goalX - (this.x + this.w/2));
            this.setCrouch(false);
            this.vx = dir * (this.getSpeed() * 1.15);
            if(Math.abs(this.vx) > 0.1 && this.onGround) AudioSys.step();
            if(dir !== 0) this.facing = dir;
            this.aimAngle = (dir >= 0) ? 0 : Math.PI;
            this.tryHopOver(obstacles, dir);
            this.applyPhysics(obstacles);
            if(rectIntersect(this, bestDoor)) {
                const from = Game.level.currentHallIndex;
                Game.level.switchHall(bestDoor.dest);
                this.meltdown.lastHall = from;
            }
        };

        if(!this.meltdown.path || this.meltdown.path.length === 0) { roam(); return; }

        const idx = Game.level.currentHallIndex;
        const path = this.meltdown.path;

        // Move through doors along path
        if(path.length > 1 && path[0] === idx) {
            const nextHall = path[1];
            let door = hall.doors.find(d => d.dest === nextHall);
            if(!door) door = hall.doors.find(d => d.dest !== -99) || null;
            if(door) {
                const goalX = door.x + door.w/2;
                const dir = Math.sign(goalX - (this.x + this.w/2));
                this.setCrouch(false);
                this.vx = dir * (this.getSpeed() * 1.2);
                if(Math.abs(this.vx) > 0.1 && this.onGround) AudioSys.step();
                if(dir !== 0) this.facing = dir;
                this.aimAngle = (dir >= 0) ? 0 : Math.PI;
                this.tryHopOver(obstacles, dir);
                this.applyPhysics(obstacles);
                if(rectIntersect(this, door)) {
                    const from = Game.level.currentHallIndex;
                    Game.level.switchHall(door.dest);
                    this.meltdown.lastHall = from;
                    this.meltdown.path = null;
                    this.meltdown.targetEnemy = null;
                }
                return;
            }
        }

        // In the hall with targets, pathfind to nearest alive and then crouch until death
        if(!this.meltdown.targetEnemy || this.meltdown.targetEnemy.dead || this.meltdown.targetEnemy.aiType === 4) {
            this.meltdown.targetEnemy = pickLocalTarget();
            if(!this.meltdown.targetEnemy) { this.meltdown.path = null; roam(); return; }
        }

        const t = this.meltdown.targetEnemy;
        const tx = t.x + t.w/2, px = this.x + this.w/2;
        const dir = Math.sign(tx - px);
        const near = getDistance(this.x, this.y, t.x, t.y) < 85;

        if(near) {
            // make target hostile to player by forcing its personality to OFFENSIVE
            if(typeof t.personality === 'string') t.personality = 'OFFENSIVE';
            this.setCrouch(true);
            this.vx = 0;
            this.applyPhysics(obstacles);
            return;
        }

        this.setCrouch(false);
        this.vx = dir * (this.getSpeed() * 1.25);
        if(Math.abs(this.vx) > 0.1 && this.onGround) AudioSys.step();
        if(dir !== 0) this.facing = dir;
        this.aimAngle = (dir >= 0) ? 0 : Math.PI;
        this.tryHopOver(obstacles, dir);
        this.applyPhysics(obstacles);
    }

    update(obstacles) {
        if (this.dead) return;

        if(this.meltdown.active && !Game.level.isTutorial) {
            Input.poll(); // keep help button responsive, etc.
            this.updateMeltdown(obstacles);
            return;
        }

        Input.poll();

        let spd = this.getSpeed();
        if (Input.active.crouch) spd *= 0.5;
        this.vx = Input.active.x * spd;
        if(this.vx !== 0) this.facing = Math.sign(this.vx);
        if (Math.abs(this.vx) > 0.1 && this.onGround) AudioSys.step();

        if(Input.active.crouch) { if(this.h === 48) this.y += 16; this.h = 32; }
        else { if(this.h === 32) this.y -= 16; this.h = 48; }

        if (Input.active.jump && this.onGround) { this.vy = -10.5; AudioSys.jump(); }

        if (Input.mode === 'PC') {
            let dx = Input.mouse.x - (this.x + this.w/2 - Game.camera.x);
            let dy = Input.mouse.y - (this.y + this.h/3 - Game.camera.y);
            this.aimAngle = Math.atan2(dy, dx);
        } else {
            if(Math.abs(Input.active.aimX) > 0.1 || Math.abs(Input.active.aimY) > 0.1) this.aimAngle = Math.atan2(Input.active.aimY, Input.active.aimX);
            else if (this.vx !== 0) this.aimAngle = (this.facing === 1) ? 0 : Math.PI;
        }

        if (this.weapon.cooldown > 0) this.weapon.cooldown--;
        if (this.weapon.reloading > 0) { this.weapon.reloading--; if(this.weapon.reloading === 0) this.weapon.ammo = this.weapon.maxAmmo; }

        if (Input.active.reload && this.weapon.type !== 'melee' && this.weapon.type !== 'knife' && this.weapon.ammo < this.weapon.maxAmmo && this.weapon.reloading === 0) {
            this.weapon.reloading = this.weapon.reloadTime;
            AudioSys.reload(this.weapon.type);
        }

        if(this.attackAnim > 0) this.attackAnim -= 0.1;
        if (Input.active.fire && this.weapon.cooldown <= 0 && this.weapon.reloading <= 0) this.attack();

        this.applyPhysics(obstacles);

        const regen = Input.active.crouch ? 0.11 : 0.055;
        if(this.health < this.maxHealth) this.health += regen;

        const hall = Game.level.getCurrentHall();
        let nearComfort = false; let seeingHorror = false;
        for (let e of hall.enemies) {
            if (e.dead) continue;
            if (e.aiType === 4) { if (getDistance(this.x+this.w/2, this.y+this.h/3, e.x+e.w/2, e.y+e.h/2) < 400) nearComfort = true; }
            if (e.aiType === 3) {
                let dist = getDistance(this.x+this.w/2, this.y+this.h/3, e.x+e.w/2, e.y+e.h/2);
                if (dist < 350) {
                    let angleToSCP = Math.atan2((e.y+e.h/2)-(this.y+this.h/3), (e.x+e.w/2)-(this.x+this.w/2));
                    let angleDiff = Math.abs(angleToSCP - this.aimAngle);
                    if (angleDiff > Math.PI) angleDiff = 2*Math.PI - angleDiff;
                    if (angleDiff < 0.8) seeingHorror = true;
                }
            }
        }

        const crouchBoost = Input.active.crouch ? 1.8 : 1.0;
        if (nearComfort) { this.insanity -= 0.5 * crouchBoost; if (this.insanity < 0) this.insanity = 0; }
        else if (seeingHorror) { this.insanity += 0.2; this.lastEvent = Game.frame; }
        else if (Game.frame - this.lastEvent > 120) { this.insanity -= 0.05 * crouchBoost; if (this.insanity < 0) this.insanity = 0; }

        if (this.insanity > this.maxInsanity) this.insanity = this.maxInsanity;

        if (this.insanity >= this.maxInsanity) {
            if (Game.level.isTutorial) { Game.restartTutorialCurrentHall(); return; }
            this.startMeltdown();
        }
    }

    attack() {
        if(this.weapon.type !== 'melee' && this.weapon.type !== 'knife' && this.weapon.ammo <= 0) return;
        this.weapon.cooldown = this.weapon.rate;
        if(this.weapon.type !== 'melee' && this.weapon.type !== 'knife') this.weapon.ammo--;
        this.attackAnim = 1.0;
        AudioSys.shoot(this.weapon.type);
        Game.playerShotFrame = Game.frame;

        let spread = (Math.random() - 0.5) * (this.weapon.spread || 0);
        let angle = this.aimAngle + spread;

        Game.camera.shake = Math.max(Game.camera.shake, 3);

        let startX = this.x + this.w/2; let startY = this.y + this.h/3;
        let hit = Game.raycast(startX, startY, startX + Math.cos(angle) * this.weapon.range, startY + Math.sin(angle) * this.weapon.range, [this]);
        if(this.weapon.type !== 'melee' && this.weapon.type !== 'knife') Game.particles.push({ x: startX, y: startY, tx: hit.x, ty: hit.y, life: 5, color: '#ffff00', update: function(){this.life--}, draw: function(ctx){ctx.strokeStyle=`rgba(255,255,0,${this.life/5})`;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(this.x,this.y);ctx.lineTo(this.tx,this.ty);ctx.stroke();} });

        if(hit.entity && typeof hit.entity.takeDamage === 'function') {
            let prevHealth = hit.entity.health;
            hit.entity.takeDamage(this.weapon.damage);

            if (hit.entity.health <= 0 && prevHealth > 0) {
                if(hit.entity instanceof Enemy) {
                    if(hit.entity.aiType === 0) this.insanity += (20 + Math.floor(Math.random()*11)); // 20-30
                    else if(hit.entity.aiType === 1 || hit.entity.aiType === 2) this.insanity += (5 + Math.floor(Math.random()*6)); // 5-10
                    else this.insanity += 10;
                } else this.insanity += 10;
                this.lastEvent = Game.frame;
            }
        } else if (hit.type === 'wall' || hit.type === 'crate') {
            for(let i=0; i<3; i++) Game.particles.push(new Particle(hit.x, hit.y, '#fff', 3, 10));
        }
    }

    takeDamage(amt) {
        super.takeDamage(amt);
        Game.camera.shake = Math.max(Game.camera.shake, 10);
        this.insanity += 5; this.lastEvent = Game.frame;
        if (Game.level.isTutorial && this.health <= 0) Game.restartTutorialCurrentHall();
    }

    die() {
        if(Game.level.isTutorial) { Game.restartTutorialCurrentHall(); return; }
        super.die();
        Game.showMeltdownText(false);
    }
}

class Enemy extends Entity {
    constructor(x, y, type) {
        super(x, y, 20, 48);
        this.aiType = type;
        this.personality = 'OFFENSIVE';
        this.caged = false;
        this.isCrouching = false;

        this._chatterCooldown = 0;
        this._lastReloading = false;
        this._retreatTalking = 0;

        if (type === 0) { this.color = '#ff9800'; this.maxHealth = 40; this.weapon = new Weapon('melee'); this.baseSpeed = 1.8; this.personality = RNG.choose(['WIMP', 'OFFENSIVE', 'DEFENSIVE']); if (RNG.next() < 0.33) this.weapon = new Weapon('knife'); }
        else if (type === 1) { this.color = '#b0bec5'; this.maxHealth = 70; this.weapon = new Weapon('pistol'); this.baseSpeed = 1.1; this.personality = RNG.choose(['OFFENSIVE', 'DEFENSIVE', 'WIMP']); }
        else if (type === 2) { this.color = '#e65100'; this.maxHealth = 120; this.weapon = new Weapon('rifle'); this.baseSpeed = 1.2; this.personality = RNG.choose(['OFFENSIVE', 'DEFENSIVE', 'WIMP']); }
        else if (type === 3) { this.color = '#d7ccc8'; this.maxHealth = 500; this.weapon = new Weapon('melee'); this.weapon.damage = 999; this.weapon.range = 40; this.baseSpeed = 0; }
        else if (type === 4) { this.color = '#ffcc80'; this.maxHealth = 1000; this.w = 30; this.h = 20; this.weapon = null; this.baseSpeed = 1.5; }

        this.health = this.maxHealth;
    }

    setCrouch(on) {
        if(on && !this.isCrouching) { this.isCrouching = true; if(this.h === 48) this.y += 16; this.h = 32; }
        else if(!on && this.isCrouching) { this.isCrouching = false; if(this.h === 32) this.y -= 16; this.h = 48; }
    }
    tryJumpOver(obstacles, dir) {
        if(!this.onGround) return false;
        const probe = { x: this.x + (dir > 0 ? this.w : -8), y: this.y + this.h - 18, w: 8, h: 18 };
        for(const c of obstacles) {
            if(rectIntersect(probe, c)) {
                if(c.h <= 90) { this.vy = -10.0; AudioSys.jump(); return true; }
            }
        }
        return false;
    }

    update(hall, player) {
        if (this.dead) return;

        if(this.speechTimer > 0) this.speechTimer--;
        if(this._chatterCooldown > 0) this._chatterCooldown--;
        if(this._retreatTalking > 0) this._retreatTalking--;

        if(this.weapon && this.weapon.reloading > 0) {
            this.weapon.reloading--;
            if(this.weapon.reloading === 0) this.weapon.ammo = this.weapon.maxAmmo;
        }
        if(this.weapon && this.weapon.cooldown > 0) this.weapon.cooldown--;

        let dist = getDistance(this.x, this.y, player.x, player.y);
        let dx = (player.x + player.w/2) - (this.x + this.w/2);

        if (this.aiType === 3) {
            if(this.caged) return;
            let isObserved = false;
            let pAngleTo173 = Math.atan2((this.y+this.h/2) - (player.y+player.h/3), (this.x+this.w/2) - (player.x+player.w/2));
            let pAngleDiff = Math.abs(pAngleTo173 - player.aimAngle);
            if(pAngleDiff > Math.PI) pAngleDiff = 2*Math.PI - pAngleDiff;
            if (pAngleDiff < 0.6 && dist < 550) isObserved = true;
            if (!isObserved) {
                for(let e of hall.enemies) {
                    if (e !== this && !e.dead && (e.aiType === 1 || e.aiType === 2)) {
                        let eDist = getDistance(this.x, this.y, e.x, e.y);
                        let eAngleTo173 = Math.atan2((this.y+this.h/2) - (e.y+e.h/3), (this.x+this.w/2) - (e.x+e.w/2));
                        let eAngleDiff = Math.abs(eAngleTo173 - e.aimAngle);
                        if(eAngleDiff > Math.PI) eAngleDiff = 2*Math.PI - eAngleDiff;
                        if (eAngleDiff < 0.6 && eDist < 500) { isObserved = true; break; }
                    }
                }
            }
            if (!isObserved) {
                let target = player;
                let minDist = dist;
                for(let e of hall.enemies) {
                    if (e !== this && !e.dead && !e.caged && (e.aiType === 0 || e.aiType === 1 || e.aiType === 2)) {
                        let d = getDistance(this.x, this.y, e.x, e.y);
                        if(d < minDist) { target = e; minDist = d; }
                    }
                }
                let tdx = (target.x + target.w/2) - (this.x + this.w/2);
                if (minDist > 30) this.x += Math.sign(tdx) * 8;
                else target.takeDamage(100);
            }
            this.applyPhysics(hall.crates);
            return;
        }

        if (this.aiType === 4) {
            let spd = this.getSpeed();
            if (dist < 400) this.vx = Math.sign(dx) * spd; else this.vx = 0;
            if (dist < 40 && player.health < player.maxHealth) player.health += 0.5;
            this.applyPhysics(hall.crates);
            return;
        }

        let dy = (player.y + player.h/3) - (this.y + this.h/3);
        this.aimAngle = Math.atan2(dy, dx);

        let hit = Game.raycast(this.x + this.w/2, this.y+15, player.x+player.w/2, player.y+15, [this]);
        let canSee = (hit.entity === player);

        let allyUnderFire = false;
        for(const e of hall.enemies) {
            if(e.dead) continue;
            if(e.aiType === 1) {
                const d = getDistance(this.x, this.y, e.x, e.y);
                if(d < 260 && (Game.frame - e.lastHitFrame) < 50) { allyUnderFire = true; break; }
            }
        }

        const wasHitRecently = (Game.frame - this.lastHitFrame) < 90;
        const playerShooting = (Game.frame - Game.playerShotFrame) < 30;
        const underThreat = playerShooting && !canSee;

        let spd = this.getSpeed();
        let desiredDir = 0;
        let wantFire = false;
        let wantCrouch = false;
        let wantJump = false;

        const towardPlayer = Math.sign(dx);

        if(this.personality === 'OFFENSIVE') {
            if(dist > 60) desiredDir = towardPlayer * spd;
            wantFire = canSee && dist < 420;
            if(underThreat) wantJump = true;

            if(this._chatterCooldown <= 0) {
                this.setSpeech(NPC_OFFENSIVE_PHRASES[Math.floor(Math.random()*NPC_OFFENSIVE_PHRASES.length)], 180);
                this._chatterCooldown = 180; // every 3s
            }
        } else if(this.personality === 'DEFENSIVE') {
            const triggered = wasHitRecently || allyUnderFire;
            if(triggered) {
                desiredDir = towardPlayer * spd * 0.6;
                wantFire = canSee && dist < 520;
            } else {
                desiredDir = -towardPlayer * spd * 0.7;
                wantFire = canSee && dist < 380 && Math.random() < 0.35;
            }
            if(!canSee && Math.random() < 0.35) wantCrouch = true;
            if(underThreat && Math.random() < 0.35) wantJump = true;
        } else if(this.personality === 'WIMP') {
            desiredDir = -towardPlayer * spd * 1.25;
            if(wasHitRecently) wantFire = canSee && dist < 520;
            if(!canSee && Math.random() < 0.55) wantCrouch = true;
            if(underThreat && Math.random() < 0.25) wantJump = true;
        }

        const isRetreating = (desiredDir * towardPlayer) < -0.01;
        if(isRetreating) {
            if(this._retreatTalking <= 0) {
                this.setSpeech(NPC_FLEE_PHRASES[Math.floor(Math.random()*NPC_FLEE_PHRASES.length)], 240);
                this._retreatTalking = 240;
            }
        }

        this.vx = desiredDir;
        if(this.vx !== 0) this.facing = Math.sign(this.vx);

        if(wantCrouch && Math.abs(desiredDir) < spd * 0.9) this.setCrouch(true);
        else this.setCrouch(false);

        if(wantJump) {
            const dir = (this.vx !== 0) ? Math.sign(this.vx) : (Math.random() < 0.5 ? -1 : 1);
            this.tryJumpOver(hall.crates, dir);
        }

        if(this.weapon && this.weapon.type !== 'melee' && this.weapon.type !== 'knife') {
            if(this.weapon.reloading <= 0 && this.weapon.ammo <= 0) {
                this.weapon.reloading = this.weapon.reloadTime;
                AudioSys.reload(this.weapon.type);
            }
        }

        const isReloading = !!(this.weapon && this.weapon.reloading > 0);
        if(isReloading && !this._lastReloading) {
            this.setSpeech(NPC_RELOAD_PHRASES[Math.floor(Math.random()*NPC_RELOAD_PHRASES.length)], 240);
        }
        this._lastReloading = isReloading;

        if (wantFire && this.weapon && this.weapon.reloading <= 0) {
            if(this.weapon.cooldown <= 0) this.fireAt(player);
        }

        if(underThreat && !this.isCrouching && Math.random() < 0.15) this.setCrouch(true);

        this.applyPhysics(hall.crates);
    }

    fireAt(player) {
        if (!this.weapon) return;

        if(this.weapon.type !== 'melee' && this.weapon.type !== 'knife') {
            if(this.weapon.reloading > 0) return;
            if(this.weapon.ammo <= 0) {
                this.weapon.reloading = this.weapon.reloadTime;
                AudioSys.reload(this.weapon.type);
                return;
            }
            this.weapon.ammo--;
        }

        this.weapon.cooldown = this.weapon.rate;
        this.attackAnim = 1.0;
        AudioSys.shoot(this.weapon.type);

        let angle = this.aimAngle + (Math.random()-0.5)*0.3;
        let startX = this.x + this.w/2; let startY = this.y + this.h/3;
        let hit = Game.raycast(startX, startY, startX + Math.cos(angle)*500, startY + Math.sin(angle)*500, [this]);
        if(this.weapon.type !== 'melee' && this.weapon.type !== 'knife') {
            Game.particles.push({ x: startX, y: startY, tx: hit.x, ty: hit.y, life: 5, color: '#f44336',
                update: function(){this.life--},
                draw: function(ctx){ctx.strokeStyle=`rgba(244,67,54,${this.life/5})`;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(this.x,this.y);ctx.lineTo(this.tx,this.ty);ctx.stroke();}
            });
        }
        if (hit.entity === player) { player.takeDamage(this.weapon.damage * 0.5); Game.camera.shake = Math.max(Game.camera.shake, 5); }
    }

    die() { if(this.dead) return; super.die(); if (this.aiType === 2) Game.drops.push(new Item('keycard', this.x + 10, this.y + this.h - 10)); }
}

class LevelManager {
    constructor() { this.halls = []; this.currentHallIndex = 0; this.isTutorial = false; this.tutorialTemplates = null; }
    _clone(obj) { return JSON.parse(JSON.stringify(obj)); }
    _buildTutorialHall(t) {
        return {
            id: t.id,
            width: t.width,
            crates: this._clone(t.crates),
            doors: this._clone(t.doors),
            drops: t.drops.map(d => new Item(d.type, d.x, d.y)),
            enemies: t.enemies.map(e => new Enemy(e.x, e.y, e.type)),
            glowsticks: [],
            tutorialLight: t.tutorialLight ? new HangingLight(t.tutorialLight.ax, t.tutorialLight.ay, t.tutorialLight.len) : null
        };
    }
    generate(seed, tutorial = false) {
        RNG = new SeededRNG(seed);
        this.halls = [];
        this.isTutorial = tutorial;

        if (tutorial) {
            this.tutorialTemplates = [
                { id:0, width:1200, crates:[], doors:[{x:1100,y:500,w:50,h:90,dest:1}], drops:[], enemies:[], tutorialLight:{ax:600,ay:140,len:120} },
                { id:1, width:1200, crates:[{x:360,y:550,w:70,h:50}], doors:[{x:100,y:500,w:50,h:90,dest:0},{x:1100,y:500,w:50,h:90,dest:2}], drops:[{type:'pistol',x:520,y:500}], enemies:[], tutorialLight:{ax:600,ay:140,len:120} },
                { id:2, width:1200, crates:[{x:460,y:550,w:80,h:60},{x:700,y:520,w:70,h:90}], doors:[{x:100,y:500,w:50,h:90,dest:1},{x:1100,y:500,w:50,h:90,dest:3}], drops:[], enemies:[{x:860,y:500,type:4}], tutorialLight:{ax:600,ay:140,len:120} },
                { id:3, width:1200, crates:[{x:520,y:550,w:60,h:50}], doors:[{x:100,y:500,w:50,h:90,dest:2},{x:1100,y:500,w:50,h:90,dest:4}], drops:[], enemies:[{x:840,y:500,type:3}], tutorialLight:{ax:600,ay:140,len:120} },
                { id:4, width:1200, crates:[{x:420,y:550,w:70,h:70},{x:720,y:550,w:70,h:70}], doors:[{x:100,y:500,w:50,h:90,dest:3},{x:1100,y:500,w:50,h:90,dest:5}], drops:[{type:'rifle',x:560,y:500}], enemies:[{x:820,y:500,type:0}], tutorialLight:{ax:600,ay:140,len:120} },
                { id:5, width:1200, crates:[{x:520,y:550,w:80,h:50}], doors:[{x:100,y:500,w:50,h:90,dest:4},{x:1100,y:500,w:60,h:100,dest:-99,isExit:true}], drops:[{type:'keycard',x:580,y:520}], enemies:[], tutorialLight:{ax:600,ay:140,len:120} },
            ];
            for(const t of this.tutorialTemplates) this.halls.push(this._buildTutorialHall(t));
            this.currentHallIndex = 0;
            return;
        }

        let count = RNG.int(12, 20);
        let exitIndex = RNG.int(count-4, count-1);

        for(let i=0; i<count; i++) {
            let width = RNG.int(1500, 2500);
            let crates = [];
            let enemies = [];
            for(let c=0; c<RNG.int(3, 6); c++) crates.push({ x: RNG.int(200, width-200), y: 600 - RNG.int(40, 90), w: RNG.int(40, 80), h: RNG.int(40, 80) });

            let hasSCP = false;
            let enemyCount = RNG.int(2, 5);
            for(let e=0; e<enemyCount; e++) {
                let type = 0;
                let roll = RNG.next();
                if (i < count / 2) { if (roll < 0.4) type = 1; }
                else { if (roll < 0.6) type = 2; }
                if (!hasSCP) { if (i > 5 && roll > 0.95) { type = 3; hasSCP = true; } else if (roll < 0.05) { type = 4; hasSCP = true; } }
                if (i === exitIndex && e === 0) type = 2;
                enemies.push(new Enemy(RNG.int(300, width-200), 500, type));
            }
            this.halls.push({ id: i, width, crates, enemies, doors: [], drops: [], glowsticks: [], tutorialLight:null });
        }

        let connections = new Set();
        for(let i=0; i<count; i++) {
            let dCount = RNG.int(2, 3);
            for(let d=0; d<dCount; d++) {
                if (this.halls[i].doors.length >= 3) continue;
                let dest = RNG.int(0, count-1);
                while(dest === i) dest = RNG.int(0, count-1);
                let linkId = [Math.min(i, dest), Math.max(i, dest)].join('-');
                if (!connections.has(linkId)) {
                    connections.add(linkId);
                    this.halls[i].doors.push({ x: RNG.int(100, this.halls[i].width-100), y: 510, w: 50, h: 90, dest: dest, isExit: false });
                    this.halls[dest].doors.push({ x: RNG.int(100, this.halls[dest].width-100), y: 510, w: 50, h: 90, dest: i, isExit: false });
                }
            }
        }

        this.halls[exitIndex].doors.push({ x: this.halls[exitIndex].width - 150, y: 500, w: 80, h: 100, dest: -99, isExit: true, locked: true });
        this.currentHallIndex = 0;
    }

    getCurrentHall() { return this.halls[this.currentHallIndex]; }

    restartTutorialHallAt(index) {
        if(!this.isTutorial || !this.tutorialTemplates) return;
        // preserve glowsticks in tutorial too across restarts? requirement didn't ask; keep simple: restart clears
        this.halls[index] = this._buildTutorialHall(this.tutorialTemplates[index]);
    }

    switchHall(index) {
        if(index === -99) { Game.win(); return; }
        let targetHall = this.halls[index];
        let returnDoor = targetHall.doors.find(d => d.dest === this.currentHallIndex);
        this.currentHallIndex = index;
        if (returnDoor) { Game.player.x = returnDoor.x; Game.player.y = 500; }
        else { Game.player.x = 100; Game.player.y = 500; }
        Game.particles = [];
        Game.itemSelectionIndex = 0;
    }
}

const Game = {

        } catch (e) { this.handleError(e); }
    },

    handleError(e) { this.running = false; document.getElementById('menu-overlay').style.display = 'flex'; errorLog.style.display = 'block'; errorLog.innerText = "CRITICAL FAILURE:\n" + e.stack; console.error(e); },
    win() { this.endGame("SURVIVED", "#4caf50"); },
    gameOver() { this.endGame("KILLED IN ACTION", "#d32f2f"); },
    endGame(msg, color) {
        this.running = false;
        document.getElementById('menu-overlay').style.display = 'flex';
        document.getElementById('ui-layer').classList.add('hidden');
        const h1 = document.querySelector('#menu-overlay h1'); h1.innerText = msg; h1.style.color = color;
        uiPrompt.style.display = 'none';
        insanityOverlay.style.opacity = 0;
