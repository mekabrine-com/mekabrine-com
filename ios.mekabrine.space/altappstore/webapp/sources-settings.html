<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sources</title>
<style>
  body {
    margin: 0;
    background: #0d0d1a;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: #12122a;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  header button {
    background: none;
    border: none;
    color: #0a84ff;
    font-size: 1rem;
    font-weight: 500;
  }
  ul {
    list-style: none;
    padding: 0;
    margin: 0;
    flex: 1;
    overflow-y: auto;
  }
  li {
    padding: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    position: relative;
    transition: transform 0.2s ease;
  }
  li .delete {
    position: absolute;
    right: -80px;
    top: 0;
    height: 100%;
    width: 80px;
    background: #ff3b30;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: 600;
  }
</style>
</head>
<body>
  <header>
    <button id="breadcrumb">Back</button>
    <div style="font-weight:600;">Sources</div>
    <button id="editBtn">Edit</button>
  </header>
  <ul id="sourceList"></ul>

<script>
const defaultSources = [
  "https://alt.getutm.app",
  "https://altstore.oatmealdome.me",
  "https://flyinghead.github.io/flycast-builds/altstore.json",
  "https://provenance-emu.com/apps.json",
  "https://alt.crystall1ne.dev",
  "https://ipa.cypwn.xyz/cypwn_altstore.json"
];

let sources = JSON.parse(localStorage.getItem("sources")) || defaultSources;
const list = document.getElementById("sourceList");
const editBtn = document.getElementById("editBtn");
const breadcrumb = document.getElementById("breadcrumb");
let editing = false;

function render() {
  list.innerHTML = "";
  sources.forEach((src, i) => {
    const li = document.createElement("li");
    li.textContent = src;
    if (editing) {
      const del = document.createElement("div");
      del.className = "delete";
      del.textContent = "Delete";
      del.addEventListener("click", () => {
        sources.splice(i, 1);
        save();
      });
      li.appendChild(del);

      let startX = 0;
      li.addEventListener("touchstart", e => startX = e.touches[0].clientX);
      li.addEventListener("touchmove", e => {
        const diff = e.touches[0].clientX - startX;
        if (diff < -30) li.style.transform = "translateX(-80px)";
        else li.style.transform = "translateX(0)";
      });
    }
    list.appendChild(li);
  });
}

function save() {
  localStorage.setItem("sources", JSON.stringify(sources));
  render();
}

editBtn.addEventListener("click", () => {
  if (!editing) {
    editing = true;
    breadcrumb.textContent = "Done";
    editBtn.textContent = "+";
  } else if (editBtn.textContent === "+") {
    const url = prompt("Enter source URL:");
    if (url && !sources.includes(url)) {
      sources.push(url);
      save();
    }
  }
  render();
});

breadcrumb.addEventListener("click", () => {
  if (breadcrumb.textContent === "Done") {
    editing = false;
    breadcrumb.textContent = "Back";
    editBtn.textContent = "Edit";
    render();
  } else {
    window.location.href = "https://ios.mekabrine.space/altappstore/webapp/";
  }
});

render();
</script>
</body>
</html>
