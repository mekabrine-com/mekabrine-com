<!DOCTYPE html>
<html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>App Store</title>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;background:#fff}
  .head{padding:28px 16px 10px;border-bottom:1px solid #eee}
  .title{font-size:34px;font-weight:800}
  .bar{display:flex;gap:8px;background:#eee;border-radius:10px;padding:10px 12px;margin-top:12px}
  input{flex:1;border:0;background:transparent;font-size:16px;outline:none}
  button{border:0;background:#007aff;color:#fff;border-radius:12px;padding:8px 14px;font-weight:700}
  .list{padding:16px}
  .card{display:flex;gap:12px;background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.1);padding:12px;margin-bottom:12px;align-items:center}
  .ic{width:56px;height:56px;border-radius:12px;background:#1f1f1f;overflow:hidden;display:grid;place-items:center}
  .ic img{width:100%;height:100%;object-fit:cover}
  .url{font-size:13px;color:#8e8e93;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style></head>
<body>
<div class="head">
  <div class="title">App Store</div>
  <div class="bar"><span>🔍</span><input id="url" type="url" placeholder="Enter website URL to install"><button onclick="install()">GET</button></div>
</div>
<div class="list" id="installed"></div>
<script>
function s2(host){return `https://www.google.com/s2/favicons?sz=64&domain=${host}`;}
async function fetchTitle(u){try{const r=await fetch(u,{mode:'cors'});const h=await r.text();const m=h.match(/<title[^>]*>([^<]+)<\\/title>/i);if(m) return m[1].trim().slice(0,28);}catch{} try{return new URL(u).hostname.replace(/^www\\./,'');}catch{return 'Web App';}}
async function install(){
  let u=document.getElementById('url').value.trim(); if(!u){alert('Enter URL');return;}
  if(!/^https?:\\/\\//i.test(u)) u='https://'+u;
  const host=new URL(u).hostname; const name=await fetchTitle(u);
  const id='web_'+Date.now(); const icon=s2(host);
  const list=JSON.parse(localStorage.getItem('webapps_v4')||'[]'); list.push({id,name,url:u,icon}); localStorage.setItem('webapps_v4',JSON.stringify(list)); render(); alert(`Installed “${name}”`);
  document.getElementById('url').value='';
}
function render(){
  const c=document.getElementById('installed'); c.innerHTML='';
  const list=[{id:'spotify',name:'Spotify',url:'app://spotify',icon:s2('spotify.com')}, ...JSON.parse(localStorage.getItem('webapps_v4')||'[]')];
  list.forEach(a=>{
    const card=document.createElement('div'); card.className='card';
    card.innerHTML=`<div class="ic">${a.icon?`<img src="${a.icon}">`:'🌐'}</div>
      <div style="flex:1;min-width:0"><div style="font-weight:700">${a.name}</div><div class="url">${a.url}</div></div>
      <button onclick="open('${a.id}')">Open</button>`;
    c.appendChild(card);
  });
}
function open(id){ if(id==='spotify'){ window.parent.postMessage({openApp:'spotify'},'*'); } else { window.parent.postMessage({openWeb:id},'*'); } }
render();
/* Let shell open webapps directly by id */
window.addEventListener('message',ev=>{}); // placeholder
</script>
</body></html>
