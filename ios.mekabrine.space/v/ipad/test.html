<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>iPadOS Shell</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;background:#000;width:100vw;height:100vh;overflow:hidden}

  :root{
    --icon-scale: 1;
    --icon-size: 90px;
    --icon-gap-v: 35px;
    --icon-label-size: 13px;
  }

  .ipad-screen{position:relative;width:100%;height:100%;overflow:hidden;background:#000}
  
  /* Home button with inverted blur */
  .home-button{position:fixed;width:60px;height:60px;background:rgba(255,255,255,.15);backdrop-filter:blur(10px) invert(1);border-radius:50%;border:2px solid rgba(255,255,255,.3);cursor:pointer;z-index:1000;transition:transform .2s ease, box-shadow .2s ease}
  .home-button:hover{transform:scale(1.1)}
  .home-button:active{transform:scale(0.9);box-shadow:0 0 20px rgba(255,255,255,.4)}
  @media (orientation:portrait){
    .home-button{bottom:20px;left:50%;transform:translateX(-50%)}
    .home-button:hover{transform:translateX(-50%) scale(1.1)}
    .home-button:active{transform:translateX(-50%) scale(0.9)}
  }
  @media (orientation:landscape){
    .home-button{right:20px;top:50%;transform:translateY(-50%)}
    .home-button:hover{transform:translateY(-50%) scale(1.1)}
    .home-button:active{transform:translateY(-50%) scale(0.9)}
  }
  .home-button::after{content:'';position:absolute;inset:0;margin:auto;width:50px;height:50px;border:2px solid rgba(255,255,255,.4);border-radius:50%}
  
  .status-bar{position:absolute;top:0;left:0;width:100%;height:30px;display:flex;justify-content:space-between;align-items:center;padding:0 20px;color:#fff;font-size:15px;font-weight:600;z-index:100;background:rgba(0,0,0,.2);backdrop-filter:blur(20px);transition:opacity .3s ease;cursor:pointer}
  .wallpaper{position:absolute;inset:0;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)}
  
  /* Lock */
  .lock{position:absolute;inset:0;z-index:900;display:flex;flex-direction:column;justify-content:space-between;align-items:center;background:radial-gradient(120% 160% at 0% 0%,#1e3a8a 0,#7c3aed 80%);padding:60px 40px;transition:opacity .4s ease, transform .4s ease}
  .lock.hidden{opacity:0;pointer-events:none;transform:scale(1.1)}
  .ltime{color:#fff;font-size:90px;font-weight:200;margin-top:80px;letter-spacing:-2px}
  .ldate{color:rgba(255,255,255,.9);font-size:28px;font-weight:500;margin-top:8px}
  .dots{display:flex;gap:20px}.dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.6);transition:all .2s ease}.dot.on{background:#fff;border-color:#fff}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .key{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;color:#fff;font-size:32px;cursor:pointer;transition:all .15s ease}
  .key:active{background:rgba(255,255,255,.3);transform:scale(0.95)}
  
  /* Home */
  .home{position:absolute;inset:0;opacity:0;transition:opacity .4s ease}
  .home.visible{opacity:1}
  .pages{position:absolute;top:60px;left:40px;right:40px;bottom:140px;overflow:hidden}
  .inner{height:100%;display:flex;transition:transform .3s cubic-bezier(.25,.46,.45,.94)}
  .page{min-width:100%;height:100%}
  .grid{height:100%;display:grid;gap:35px 25px;padding:20px 0}
  .icon{display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform .2s ease}
  .icon:active .im{transform:scale(0.9)}
  .im{
    width:var(--icon-size);
    height:var(--icon-size);
    border-radius:22px;display:grid;place-items:center;font-size:48px;margin-bottom:8px;
    background:#1f1f1f;color:#fff;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.35);
    transition:transform .2s ease, background .2s ease, color .2s ease, backdrop-filter .2s ease
  }
  .im img{width:100%;height:100%;object-fit:cover}
  .label{color:#fff;font-size:var(--icon-label-size);text-shadow:0 1px 3px rgba(0,0,0,.6);max-width:calc(var(--icon-size) + 10px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dots2{position:absolute;bottom:110px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
  .p{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4);transition:all .3s ease}.p.active{background:#fff;width:20px;border-radius:4px}
  .dock{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.25);backdrop-filter:blur(40px) saturate(180%);border-radius:26px;padding:14px 24px;display:flex;gap:24px;z-index:5}
  
  /* App window */
  .win{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:500;transition:opacity .3s ease}
  .win.active{opacity:1;pointer-events:all}
  iframe.app{width:100%;height:100%;border:0;position:absolute;top:0;left:0;display:none}
  iframe.app.active{display:block}
  
  /* NC and CC */
  .overlay{position:absolute;inset:0;display:none;animation:fadeIn .3s ease}
  .overlay.open{display:block}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .dim{position:absolute;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(10px)}
  .panel{position:absolute;left:50%;top:28px;transform:translateX(-50%);width:min(92vw,1100px);height:min(88vh,760px);background:radial-gradient(120% 160% at 0% 0%, #1e3a8a 0, #7c3aed 80%);border-radius:32px;padding:18px;color:#fff;animation:slideDown .3s cubic-bezier(.25,.46,.45,.94)}
  @keyframes slideDown{from{transform:translateX(-50%) translateY(-100px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
  .cc{position:absolute;right:18px;top:18px;width:420px;max-width:42vw;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;animation:slideDown .3s cubic-bezier(.25,.46,.45,.94)}
  .tile{background:rgba(28,28,30,.85);backdrop-filter:blur(20px);border-radius:22px;color:#fff;display:grid;place-items:center;min-height:86px;border:1px solid rgba(255,255,255,.08);cursor:pointer;transition:all .2s ease}
  .tile:active{transform:scale(0.97);background:rgba(38,38,40,.85)}
  .pill{height:180px;padding:12px;display:flex;flex-direction:column;gap:10px}
  .slider{flex:1;background:rgba(255,255,255,.15);border-radius:18px;position:relative}
  .knob{position:absolute;left:0;right:0;bottom:0;height:50%;background:#fff;border-radius:18px 18px 0 0;transition:height .1s ease}
  
  /* Switcher */
  .switcher{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);display:none;z-index:700;animation:fadeIn .25s ease}
  .switcher.open{display:block}
  .row{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:24px;flex-wrap:wrap;justify-content:center;max-width:90vw;padding:40px 20px}
  .card{width:320px;height:240px;border-radius:16px;background:#1c1c1e;color:#fff;border:1px solid rgba(255,255,255,.15);cursor:pointer;position:relative;touch-action:none;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.4);display:flex;flex-direction:column}
  .card:hover{border-color:rgba(255,255,255,.3)}
  .card-preview{flex:1;background:#000;position:relative;overflow:hidden;border-radius:12px 12px 0 0;pointer-events:none}
  .card-preview iframe{width:100%;height:100%;border:0;transform:scale(0.25);transform-origin:top left;pointer-events:none}
  .card-title{padding:12px;font-size:15px;font-weight:500;text-align:center;background:rgba(28,28,30,.95);border-radius:0 0 12px 12px}
  .card-close{position:absolute;top:8px;right:8px;width:28px;height:28px;background:rgba(255,59,48,.9);border-radius:50%;display:none;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:600;z-index:10;cursor:pointer}
  .card:hover .card-close{display:flex}
  .close-all-btn{position:fixed;bottom:15px;right:15px;width:44px;height:44px;background:rgba(255,59,48,.9);border-radius:50%;display:none;align-items:center;justify-items:center;color:#fff;font-size:24px;font-weight:600;z-index:800;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3)}
  .switcher.open .close-all-btn{display:grid}
  @keyframes killCard{to{transform:translateY(-400px) scale(0.7);opacity:0}}
</style>
</head>
<body>
<div class="ipad-screen" id="screen">
  <div class="status-bar"><div id="t">10:30</div><div>🔊 <span id="v">50</span>%</div></div>
  <div class="wallpaper"></div>

  <!-- Lock -->
  <div class="lock" id="lock">
    <div>
      <div class="ltime" id="lt">10:30</div>
      <div class="ldate" id="ld">Saturday, November 8</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:30px;margin-bottom:120px">
      <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      <div class="pad" id="pad"></div>
    </div>
  </div>

  <!-- Home -->
  <div class="home" id="home">
    <div class="pages" id="pages"><div class="inner" id="inner"></div></div>
    <div class="dots2" id="dots"></div>
    <div class="dock" id="dock"></div>
  </div>

  <!-- Notification Center -->
  <div class="overlay" id="nc">
    <div class="dim" onclick="closeNC()"></div>
    <div class="panel">
      <div style="text-align:center;font-size:86px;font-weight:800" id="ncTime">8:34</div>
      <div style="text-align:center;opacity:.9" id="ncDate">Sat Nov 8</div>
      <div style="margin-top:18px;max-height:64vh;overflow:auto">
        <div style="background:rgba(20,20,20,.55);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:12px 14px;margin:10px auto;max-width:820px"><b>Welcome</b> • Demo notification</div>
      </div>
    </div>
  </div>

  <!-- Control Center -->
  <div class="overlay" id="cc">
    <div class="dim" onclick="closeCC()"></div>
    <div class="cc">
      <div class="tile">✈️ Airplane</div>
      <div class="tile">📶 Wi-Fi</div>
      <div class="tile pill"><div>☀️ Brightness</div><div class="slider" id="bSlide"><div class="knob" id="bKnob"></div></div></div>
      <div class="tile pill"><div>🔊 Volume</div><div class="slider" id="vSlide"><div class="knob" id="vKnob"></div></div></div>
    </div>
  </div>

  <!-- App switcher -->
  <div class="switcher" id="sw">
    <div class="row" id="swRow"></div>
    <div class="close-all-btn" id="closeAllBtn" onclick="closeAllApps()">✕</div>
  </div>

  <!-- Foreground app -->
  <div class="win" id="win"></div>

  <!-- Home button -->
  <div class="home-button" id="homeBtn"></div>
</div>

<script>
const PASS='0000';
const state={
  locked:true, 
  password: localStorage.getItem('device_password') || '0000',
  passwordEnabled: localStorage.getItem('password_enabled') !== 'false',
  page:0, 
  volume:0.5, 
  brightness:0.8,
  activeApp: null,
  backgroundedApps: {},
  // Settings
  iconScale: parseFloat(localStorage.getItem('icon_scale')) || 1,
  iconBackground: localStorage.getItem('icon_bg') || 'dark',
  showLabels: localStorage.getItem('show_labels') !== 'false',
  homeButtonStyle: localStorage.getItem('home_btn_style') || 'blur behind',
  homeButtonSize: localStorage.getItem('home_btn_size') || 'normal',
  includeDate: localStorage.getItem('include_date') === 'true',
  useButtons: localStorage.getItem('use_buttons') === 'true',
  closeAllButton: localStorage.getItem('close_all_btn') === 'true',
  assistantEnabled: localStorage.getItem('assistant_enabled') === 'true',
  assistantKey: localStorage.getItem('assistant_key') || '',
  // Appearance extensions
  iconsPerRow: parseInt(localStorage.getItem('icons_per_row') || '0', 10), // 0 = auto
  rowsCount:   parseInt(localStorage.getItem('rows_count')   || '0', 10),  // 0 = auto
  apps:[
    {id:'settings',name:'Settings', icon:'⚙️',   builtin:true, dock:false},
    {id:'safari',  name:'Safari',   icon:'🧭',   path:'/v/apps/safari.html',  dock:true},
    {id:'photos',  name:'Photos',   icon:'🌺',   path:'/v/apps/photos.html',  dock:true},
    {id:'camera',  name:'Camera',   icon:'📷',   path:'/v/apps/camera.html' },
    {id:'spotify', name:'Spotify',  icon:'https://www.google.com/s2/favicons?sz=64&domain=spotify.com', path:'/v/apps/spotify.html', dock:true, keepAlive:true},
    {id:'appstore',name:'App Store',icon:'📦',   path:'/v/apps/appstore.html', dock:true},
    {id:'notes',   name:'Notes',    icon:'📝',   path:'/v/apps/notes.html' },
    {id:'youtube',   name:'YouTube',    icon:'🎥',   path:'/v/apps/youtube.html' },
    {id:'calc',    name:'Calculator',icon:'🔢',  path:'/v/apps/calculator.html' }
  ],
  webapps: JSON.parse(localStorage.getItem('webapps_v4')||'[]')
};

const lockEl = document.getElementById('lock');
const homeEl = document.getElementById('home');
const winEl  = document.getElementById('win');
const dock   = document.getElementById('dock');
const inner  = document.getElementById('inner');
const dots   = document.getElementById('dots');
const sw     = document.getElementById('sw');
const swRow  = document.getElementById('swRow');

function clock(){
  const n=new Date(),h=(n.getHours()%12)||12,m=String(n.getMinutes()).padStart(2,'0');
  const timeStr = `${h}:${m}`;
  const dateStr = state.includeDate ? ' • ' + n.toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '';
  document.getElementById('t').textContent = timeStr + dateStr;
  document.getElementById('lt').textContent= timeStr;
  document.getElementById('ld').textContent= n.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  document.getElementById('ncTime').textContent=timeStr;
  document.getElementById('ncDate').textContent=n.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
setInterval(clock,1000); clock();

/* Passcode pad */
const pad=document.getElementById('pad'); 
for(let n of '123456789⌫0 '){ 
  const b=document.createElement('div'); 
  if(n!==' '){ 
    b.className='key'; 
    b.textContent=n; 
    b.onclick=()=>press(n);
  } 
  pad.appendChild(b); 
}
let cur=''; 
function press(n){ 
  if(!state.passwordEnabled){
    unlock();
    return;
  }
  if(n==='⌫'){cur=cur.slice(0,-1);} 
  else if(cur.length<4){ 
    cur+=n; 
    if(cur.length===4){ 
      setTimeout(()=>{ 
        if(cur===state.password){ unlock(); } 
        cur=''; 
        paintDots(); 
      },120);
    } 
    paintDots(); 
  } 
}
function paintDots(){ 
  document.querySelectorAll('.dots .dot').forEach((d,i)=>d.classList.toggle('on',i<cur.length)); 
}
function unlock(){ 
  state.locked=false; 
  lockEl.classList.add('hidden'); 
  homeEl.classList.add('visible');
  applySettings();
}

/* CC + NC */
const cc=document.getElementById('cc'), nc=document.getElementById('nc');
function openCC(){cc.classList.add('open')} 
function closeCC(){cc.classList.remove('open')}
function openNC(){nc.classList.add('open')} 
function closeNC(){nc.classList.remove('open')}

/* Volume + Brightness sliders */
function slideY(container, knob, cb){ 
  let start=false; 
  const pos=e=>(e.touches?e.touches[0]:e).clientY; 
  const onDown=e=>{start=true;update(e);e.preventDefault()}; 
  const onUp=()=>start=false; 
  const update=e=>{ 
    if(!start) return; 
    const r=container.getBoundingClientRect(); 
    const y=Math.max(r.top,Math.min(r.bottom,pos(e))); 
    const pct=1-(y-r.top)/r.height; 
    knob.style.height=Math.max(8,pct*100)+'%'; 
    cb(pct);
  }; 
  container.addEventListener('mousedown',onDown); 
  container.addEventListener('touchstart',onDown); 
  window.addEventListener('mousemove',update); 
  window.addEventListener('touchmove',update,{passive:false}); 
  window.addEventListener('mouseup',onUp); 
  window.addEventListener('touchend',onUp);
}
slideY(document.getElementById('vSlide'),document.getElementById('vKnob'),v=>{
  state.volume=v; 
  document.getElementById('v').textContent=Math.round(v*100);
});
slideY(document.getElementById('bSlide'),document.getElementById('bKnob'),v=>{
  state.brightness=v;
  homeEl.style.filter=`brightness(${.4+.6*v})`;
});

// Set initial brightness
document.getElementById('bKnob').style.height = (state.brightness*100)+'%';

/* Layout + Pagination helpers */
function allApps(){ 
  return [...state.apps, ...state.webapps.map(w=>({id:w.id,name:w.name,icon:w.icon,url:w.url}))]; 
}
function iconEl(app){ 
  const d=document.createElement('div'); 
  d.className='icon';
  const i=document.createElement('div'); 
  i.className='im'; 

  // Background style
  if(state.iconBackground === 'clear'){
    i.style.background = 'rgba(255,255,255,.25)';
    i.style.backdropFilter = 'blur(20px) saturate(160%)';
    i.style.color = '#000';
  } else if(state.iconBackground === 'light'){
    i.style.background = '#f2f2f7';
    i.style.backdropFilter = '';
    i.style.color = '#111';
  } else { // dark
    i.style.background = '#1f1f1f';
    i.style.backdropFilter = '';
    i.style.color = '#fff';
  }

  if(app.icon?.startsWith?.('http')){
    const im=document.createElement('img'); 
    im.src=app.icon; 
    i.appendChild(im);
  } else {
    i.textContent=app.icon||app.name[0];
  }
  const l=document.createElement('div'); 
  l.className='label'; 
  l.textContent=app.name;
  l.style.display = state.showLabels ? 'block' : 'none';
  d.append(i,l); 
  i.onclick=(e)=>{e.stopPropagation();openApp(app)};
  l.onclick=(e)=>{e.stopPropagation();openApp(app)};
  return d; 
}

/* Render with fixed columns and rows if set */
function render(){
  // Dock
  dock.innerHTML='';
  state.apps.filter(a=>a.dock).forEach(a=>dock.appendChild(iconEl(a)));

  // Non-dock apps
  const apps = allApps().filter(a=>!a.dock);

  // Columns
  let cols;
  if(state.iconsPerRow && state.iconsPerRow > 0){
    cols = state.iconsPerRow;
  } else {
    const probe=document.createElement('div'); 
    probe.className='grid'; 
    probe.style.visibility='hidden'; 
    document.body.appendChild(probe);
    cols=(getComputedStyle(probe).gridTemplateColumns.match(/1fr/g)||[]).length||6;
    document.body.removeChild(probe);
  }

  // Rows
  let rows;
  if(state.rowsCount && state.rowsCount > 0){
    rows = state.rowsCount;
  } else {
    const box=document.getElementById('pages'); 
    const cellH=(90*(state.iconScale||1)) + 8 + (35*(state.iconScale||1));
    rows=Math.max(1,Math.floor((box.clientHeight-40)/cellH));
  }

  const per = cols * rows;

  inner.innerHTML=''; 
  dots.innerHTML='';

  const pagesCount = Math.max(1, Math.ceil(apps.length / per));
  for(let p=0;p<pagesCount;p++){
    const page=document.createElement('div'); 
    page.className='page';
    const grid=document.createElement('div'); 
    grid.className='grid';
    grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    apps.slice(p*per,(p+1)*per).forEach(a=>grid.appendChild(iconEl(a)));
    page.appendChild(grid); 
    inner.appendChild(page);
    const dot=document.createElement('div'); 
    dot.className='p'+(p===state.page?' active':''); 
    dots.appendChild(dot);
  }

  state.page = Math.max(0, Math.min(state.page, dots.children.length-1));
  updatePage();
}
function updatePage(){ 
  const w=document.getElementById('pages').clientWidth; 
  document.getElementById('inner').style.transform=`translateX(${-state.page*w}px)`; 
  [...dots.children].forEach((d,i)=>d.classList.toggle('active',i===state.page)); 
}
window.addEventListener('resize',render);
let sx=0,dx=0;
document.getElementById('pages').addEventListener('touchstart',e=>{
  sx=e.touches[0].clientX; 
  dx=0;
});
document.getElementById('pages').addEventListener('touchmove',e=>{
  dx=e.touches[0].clientX-sx;
});
document.getElementById('pages').addEventListener('touchend',()=>{ 
  if(Math.abs(dx)>80){ 
    state.page += dx<0?1:-1; 
    state.page=Math.max(0,Math.min(state.page,dots.children.length-1)); 
    updatePage(); 
  }
});

/* Open apps with persistent iframes */
function getOrCreateIframe(appId){
  let iframe = document.getElementById('iframe_'+appId);
  if(!iframe){
    iframe = document.createElement('iframe');
    iframe.id = 'iframe_'+appId;
    iframe.className = 'app';
    winEl.appendChild(iframe);
  }
  return iframe;
}

function openApp(app){
  if(state.locked) return;
  
  // Settings
  if(app.id === 'settings'){
    openSettings();
    return;
  }
  
  const meta = app.url ? app : state.apps.find(a=>a.id===app.id);
  if(!meta) return;
  
  // Background current app
  if(state.activeApp){
    const currentIframe = document.getElementById('iframe_'+state.activeApp);
    if(currentIframe){
      currentIframe.classList.remove('active');
      const appMeta = state.apps.find(a=>a.id===state.activeApp);
      if(!appMeta?.keepAlive && state.activeApp !== 'spotify'){
        state.backgroundedApps[state.activeApp] = {
          iframe: currentIframe,
          timestamp: Date.now()
        };
      }
    }
  }
  
  state.activeApp = app.id;
  const iframe = getOrCreateIframe(app.id);
  
  if(!iframe.src || iframe.src === 'about:blank'){
    iframe.src = meta.url || meta.path;
  }
  
  iframe.classList.add('active');
  winEl.classList.add('active');
  homeEl.style.display='none';
}

function goHome(){ 
  if(state.activeApp){
    const currentIframe = document.getElementById('iframe_'+state.activeApp);
    if(currentIframe){
      currentIframe.classList.remove('active');
      const appMeta = state.apps.find(a=>a.id===state.activeApp);
      if(!appMeta?.keepAlive && state.activeApp !== 'spotify'){
        state.backgroundedApps[state.activeApp] = {
          iframe: currentIframe,
          timestamp: Date.now()
        };
      }
    }
  }
  
  state.activeApp = null;
  winEl.classList.remove('active'); 
  homeEl.style.display='block'; 
}

function killApp(appId){
  const iframe = document.getElementById('iframe_'+appId);
  if(iframe){
    iframe.remove();
  }
  delete state.backgroundedApps[appId];
  if(state.activeApp === appId){
    state.activeApp = null;
  }
}

// Cleanup backgrounded apps after 1 minute (foreground apps are never auto-closed)
setInterval(()=>{
  const now = Date.now();
  for(let appId in state.backgroundedApps){
    const bg = state.backgroundedApps[appId];
    if(now - bg.timestamp > 60000){
      killApp(appId);
    }
  }
}, 5000);

/* Switcher (double tap home) */
const homeBtn=document.getElementById('homeBtn'); 
let last=0;
homeBtn.addEventListener('click',()=>{ 
  const now=Date.now(); 
  if(now-last<350){ 
    openSwitcher(); 
  } else { 
    goHome(); 
  } 
  last=now; 
});

function openSwitcher(){ 
  swRow.innerHTML=''; 
  
  const runningApps = [];
  if(state.activeApp){
    runningApps.push(state.activeApp);
  }
  for(let appId in state.backgroundedApps){
    if(!runningApps.includes(appId)){
      runningApps.push(appId);
    }
  }
  
  runningApps.forEach(appId=>{ 
    const appMeta = allApps().find(a=>a.id===appId);
    if(!appMeta) return;
    
    const c = document.createElement('div'); 
    c.className = 'card';
    
    const preview = document.createElement('div');
    preview.className = 'card-preview';
    
    const originalIframe = document.getElementById('iframe_'+appId);
    if(originalIframe){
      const previewIframe = document.createElement('iframe');
      previewIframe.src = originalIframe.src;
      previewIframe.style.width = '1280px';
      previewIframe.style.height = '960px';
      preview.appendChild(previewIframe);
    }
    
    const title = document.createElement('div');
    title.className = 'card-title';
    title.textContent = appMeta.name;
    
    c.appendChild(preview);
    c.appendChild(title);
    
    if(state.useButtons){
      const closeBtn = document.createElement('div');
      closeBtn.className = 'card-close';
      closeBtn.textContent = '✕';
      closeBtn.onclick = (e) => {
        e.stopPropagation();
        c.style.transition = 'all .3s ease';
        c.style.transform = 'translateY(-400px) scale(0.7)';
        c.style.opacity = '0';
        setTimeout(() => {
          killApp(appId);
          c.remove();
          if(swRow.children.length === 0) sw.classList.remove('open');
        }, 300);
      };
      c.appendChild(closeBtn);
    }
    
    let startY = 0, currentY = 0, isDragging = false;
    const cardHeight = 240;
    
    c.addEventListener('touchstart', e => {
      startY = e.touches[0].clientY;
      currentY = 0;
      isDragging = true;
      c.style.transition = 'none';
    });
    
    c.addEventListener('touchmove', e => {
      if(!isDragging) return;
      currentY = startY - e.touches[0].clientY;
      if(currentY > 0){
        c.style.transform = `translateY(-${currentY}px)`;
        c.style.opacity = Math.max(0.3, 1 - currentY / cardHeight);
      }
    });
    
    c.addEventListener('touchend', () => {
      if(!isDragging) return;
      isDragging = false;
      c.style.transition = 'all .3s ease';
      
      if(currentY > cardHeight / 2){
        c.style.transform = `translateY(-${cardHeight * 2}px)`;
        c.style.opacity = '0';
        setTimeout(() => {
          killApp(appId);
          c.remove();
          if(swRow.children.length === 0){
            sw.classList.remove('open');
          }
        }, 300);
      } else {
        c.style.transform = '';
        c.style.opacity = '';
      }
    });
    
    c.addEventListener('click', e => {
      if(currentY < 10){
        sw.classList.remove('open'); 
        openApp(appMeta);
      }
    }); 
    
    swRow.appendChild(c); 
  }); 
  
  sw.classList.add('open'); 
}
sw.addEventListener('click',e=>{ 
  if(e.target===sw) sw.classList.remove('open'); 
});

/* Settings App */
function openSettings(){
  const isWide = window.innerWidth > 768;
  let currentSection = 'general';
  
  function renderSettings(){
    const sections = {
      general: {
        title: 'General',
        items: [{type:'info', label:'Software Version', value:'mPadOS 1.1'}]
      },
      appearance: {
        title: 'Appearance',
        items: [
          {type:'slider', label:'Icon Scale', min:0.25, max:3, step:0.05, value:state.iconScale, key:'iconScale'},
          {type:'select', label:'Icon Background', options:['light','dark','clear'], value:state.iconBackground, key:'iconBackground'},
          {type:'switch', label:'Show App Labels', value:state.showLabels, key:'showLabels'},
          {type:'select', label:'Home Button', options:['blur behind','clear','solid invert behind','blur invert behind'], value:state.homeButtonStyle, key:'homeButtonStyle'},
          {type:'select', label:'Home Button Size', options:['itty bitty','small','normal','big','MASSIVE'], value:state.homeButtonSize, key:'homeButtonSize'},
          {type:'switch', label:'Include Date After Time', value:state.includeDate, key:'includeDate'},
          {type:'slider', label:'Icons per row', min:3, max:12, step:1, value:state.iconsPerRow||0, key:'iconsPerRow'},
          {type:'slider', label:'Number of rows', min:1, max:10, step:1, value:state.rowsCount||0, key:'rowsCount'}
        ]
      },
      functionality: {
        title: 'Functionality',
        items: [
          {type:'switch', label:'Buttons Instead of Gestures', value:state.useButtons, key:'useButtons'},
          {type:'switch', label:'Close All Apps Button', value:state.closeAllButton, key:'closeAllButton'},
          {type:'switch', label:'Hold Home for Assistant', value:state.assistantEnabled, key:'assistantEnabled'},
          ...(state.assistantEnabled ? [{type:'input', label:'VoidAI API Key', placeholder:'sk-voidai-...', value:state.assistantKey, key:'assistantKey'}] : [])
        ]
      },
      security: {
        title: 'Security',
        items: [
          {type:'button', label:'Change Password', action:'changePass'},
          {type:'button', label:'Turn Off Password', action:'disablePass'}
        ]
      }
    };

    const headStyles = `<style>
      .sw-item{padding:16px 20px;border-bottom:1px solid #e5e5ea;display:flex;justify-content:space-between;align-items:center}
      .switch{position:relative;display:inline-block;width:51px;height:31px}
      .switch input{opacity:0;width:0;height:0}
      .switch .track{position:absolute;top:0;left:0;right:0;bottom:0;background:#ccc;transition:.25s;border-radius:34px}
      .switch .thumb{position:absolute;height:27px;width:27px;left:2px;bottom:2px;background:#fff;transition:transform .25s;border-radius:50%}
      .switch input:checked + .track{background:#007AFF}
      .switch input:checked + .track + .thumb{transform:translateX(20px)}
    </style>`;

    const sidebar = Object.keys(sections).map(key => 
      `<div onclick="parent.selectSection('${key}')" style="padding:14px 20px;cursor:pointer;background:${currentSection===key?'rgba(0,122,255,.1)':'transparent'};border-left:3px solid ${currentSection===key?'#007AFF':'transparent'};font-weight:${currentSection===key?'600':'400'}">${sections[key].title}</div>`
    ).join('');
    
    const content = sections[currentSection].items.map(item => {
      if(item.type === 'info') return `<div style="padding:16px 20px;border-bottom:1px solid #e5e5ea"><div style="color:#666;font-size:14px">${item.label}</div><div style="font-size:16px;margin-top:4px">${item.value}</div></div>`;
      if(item.type === 'slider') return `<div style="padding:16px 20px;border-bottom:1px solid #e5e5ea">
        <div style="margin-bottom:8px">${item.label}: <span id="val_${item.key}">${
          (item.key==='iconsPerRow' || item.key==='rowsCount') ? ((item.value||0)===0?'Auto':item.value) : Number(item.value).toFixed(2)
        }</span></div>
        <input type="range" min="${item.min}" max="${item.max}" step="${item.step}" value="${item.value}"
          onchange="parent.updateSetting('${item.key}', ${(item.key==='iconScale')?'parseFloat(this.value)':'parseInt(this.value,10)'} )"
          oninput="document.getElementById('val_${item.key}').textContent=${
            (item.key==='iconsPerRow' || item.key==='rowsCount')
              ? `(+this.value===0?'Auto':this.value)`
              : `parseFloat(this.value).toFixed(2)`
          }"
          style="width:100%">
      </div>`;
      if(item.type === 'select') return `<div style="padding:16px 20px;border-bottom:1px solid #e5e5ea"><div style="margin-bottom:8px">${item.label}</div><select onchange="parent.updateSetting('${item.key}', this.value)" style="width:100%;padding:8px;font-size:16px;border:1px solid #ccc;border-radius:8px">${item.options.map(o=>`<option value="${o}" ${o===item.value?'selected':''}>${o}</option>`).join('')}</select></div>`;
      if(item.type === 'switch') return `<div class="sw-item"><div>${item.label}</div>
        <label class="switch">
          <input type="checkbox" ${item.value?'checked':''} onchange="parent.updateSetting('${item.key}', this.checked)">
          <span class="track"></span><span class="thumb"></span>
        </label>
      </div>`;
      if(item.type === 'input') return `<div style="padding:16px 20px;border-bottom:1px solid #e5e5ea"><div style="margin-bottom:8px">${item.label}</div><input type="text" value="${item.value}" placeholder="${item.placeholder}" onchange="parent.updateSetting('${item.key}', this.value)" style="width:100%;padding:10px;font-size:16px;border:1px solid #ccc;border-radius:8px"></div>`;
      if(item.type === 'button') return `<div onclick="parent.settingsAction('${item.action}')" style="padding:16px 20px;border-bottom:1px solid #e5e5ea;color:#007AFF;cursor:pointer;text-align:center">${item.label}</div>`;
      return '';
    }).join('');
    
    if(isWide){
      return `${headStyles}<div style="display:flex;height:100%;background:#f2f2f7">
        <div style="width:280px;background:#fff;border-right:1px solid #e5e5ea;overflow:auto">
          <div style="padding:20px;font-size:28px;font-weight:700;color:#000">Settings</div>
          ${sidebar}
        </div>
        <div style="flex:1;overflow:auto;padding:20px">
          <h2 style="font-size:28px;font-weight:700;margin-bottom:20px;color:#000">${sections[currentSection].title}</h2>
          <div style="background:#fff;border-radius:12px;overflow:hidden">${content}</div>
        </div>
      </div>`;
    } else {
      return `${headStyles}<div style="background:#f2f2f7;height:100%;overflow:auto">
        <div style="background:#fff;padding:16px 20px;border-bottom:1px solid #e5e5ea;display:flex;align-items:center;gap:12px">
          ${currentSection !== 'general' ? '<div onclick="parent.selectSection(\'general\')" style="font-size:24px;color:#007AFF;cursor:pointer">‹</div>' : ''}
          <div style="font-size:20px;font-weight:600;color:#000">${sections[currentSection].title}</div>
        </div>
        ${currentSection === 'general' ? '<div style="padding:20px">'+Object.keys(sections).filter(k=>k!=='general').map(k=>`<div onclick="parent.selectSection('${k}')" style="background:#fff;padding:16px 20px;margin-bottom:12px;border-radius:12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center"><div>${sections[k].title}</div><div style="color:#999">›</div></div>`).join('')+'</div>' : `<div style="background:#fff;margin:20px;border-radius:12px;overflow:hidden">${content}</div>`}
      </div>`;
    }
  }
  
  const iframe = getOrCreateIframe('settings');
  iframe.srcdoc = renderSettings();
  iframe.classList.add('active');
  
  if(state.activeApp){
    const currentIframe = document.getElementById('iframe_'+state.activeApp);
    if(currentIframe) currentIframe.classList.remove('active');
  }
  
  state.activeApp = 'settings';
  winEl.classList.add('active');
  homeEl.style.display='none';
  
  window.selectSection = (section) => {
    currentSection = section;
    iframe.srcdoc = renderSettings();
  };
}

function storageKeyFor(key){
  const map={
    iconBackground:'icon_bg',
    homeButtonStyle:'home_btn_style',
    homeButtonSize:'home_btn_size',
    iconScale:'icon_scale',
    showLabels:'show_labels',
    includeDate:'include_date',
    useButtons:'use_buttons',
    closeAllButton:'close_all_btn',
    assistantEnabled:'assistant_enabled',
    assistantKey:'assistant_key',
    iconsPerRow:'icons_per_row',
    rowsCount:'rows_count'
  };
  return map[key] || key.replace(/([A-Z])/g,'_$1').toLowerCase();
}

window.updateSetting = function(key, value){
  state[key] = value;
  const sk = storageKeyFor(key);
  // Persist primitives as strings
  localStorage.setItem(sk, typeof value === 'boolean' ? String(value) : String(value));
  applySettings();
  if(key === 'assistantEnabled') openSettings();
}

window.settingsAction = function(action){
  if(action === 'changePass'){
    const old = prompt('Enter current password:');
    if(old !== state.password) return alert('Incorrect password');
    const newPass = prompt('Enter new password (4 digits):');
    if(!newPass || newPass.length !== 4 || !/^\d+$/.test(newPass)) return alert('Invalid password');
    const confirm = prompt('Confirm new password:');
    if(newPass !== confirm) return alert('Passwords do not match');
    state.password = newPass;
    localStorage.setItem('device_password', newPass);
    alert('Password changed successfully');
  } else if(action === 'disablePass'){
    const pass = prompt('Enter current password to disable:');
    if(pass !== state.password) return alert('Incorrect password');
    if(confirm('Are you sure you want to disable the passcode?')){
      state.passwordEnabled = false;
      localStorage.setItem('password_enabled', 'false');
      alert('Passcode disabled');
    }
  }
}

function applySettings(){
  // Home button style
  const btn = document.getElementById('homeBtn');
  const sizes = {'itty bitty':40,'small':50,'normal':60,'big':75,'MASSIVE':100};
  const size = sizes[state.homeButtonSize] || 60;
  btn.style.width = size+'px';
  btn.style.height = size+'px';
  
  if(state.homeButtonStyle === 'blur behind') btn.style.backdropFilter = 'blur(10px)';
  else if(state.homeButtonStyle === 'clear') btn.style.backdropFilter = 'blur(10px)';
  else if(state.homeButtonStyle === 'solid invert behind') btn.style.backdropFilter = 'invert(1)';
  else if(state.homeButtonStyle === 'blur invert behind') btn.style.backdropFilter = 'blur(10px) invert(1)';
  
  // Close all button
  document.getElementById('closeAllBtn').style.display = state.closeAllButton ? 'grid' : 'none';

  // Icon scale
  const root = document.documentElement;
  const clamped = Math.max(0.25, Math.min(3, state.iconScale || 1));
  root.style.setProperty('--icon-scale', clamped);
  root.style.setProperty('--icon-size', (90 * clamped) + 'px');
  root.style.setProperty('--icon-label-size', (13 * clamped) + 'px');

  // Re-render UI to apply backgrounds and grid sizing
  render();
  clock();
}

function closeAllApps(){
  for(let appId in state.backgroundedApps){
    killApp(appId);
  }
  if(state.activeApp){
    killApp(state.activeApp);
  }
  sw.classList.remove('open');
}

/* Gestures: top-left 2/3 = NC, top-right 1/3 = CC, bottom swipe up = home */
const scr=document.getElementById('screen');
let gx=0,gy=0;
scr.addEventListener('touchstart',e=>{ 
  gx=e.touches[0].clientX; 
  gy=e.touches[0].clientY; 
});
scr.addEventListener('touchend',e=>{
  const ex=e.changedTouches[0].clientX, ey=e.changedTouches[0].clientY, dy=ey-gy;
  const w=innerWidth;
  if(!state.useButtons){
    if(dy>60 && gy<60){ 
      if(gx<w*(2/3)) openNC(); 
      else openCC(); 
    }
  }
  if(dy<-100 && gy>innerHeight*0.8) goHome();
});

// Button mode for status bar
document.getElementById('t').parentElement.addEventListener('click', e=>{
  if(!state.useButtons) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  const width = rect.width;
  if(clickX < width * (2/3)) openNC();
  else openCC();
});

// Home button hold for assistant
let holdTimer = null;
homeBtn.addEventListener('mousedown', ()=>{
  if(!state.assistantEnabled) return;
  holdTimer = setTimeout(()=>{
    openAssistant();
  }, 800);
});
homeBtn.addEventListener('mouseup', ()=>{
  if(holdTimer) clearTimeout(holdTimer);
});
homeBtn.addEventListener('touchstart', ()=>{
  if(!state.assistantEnabled) return;
  holdTimer = setTimeout(()=>{
    openAssistant();
  }, 800);
});
homeBtn.addEventListener('touchend', ()=>{
  if(holdTimer) clearTimeout(holdTimer);
});

async function openAssistant(){
  const query = prompt('Ask the assistant:');
  if(!query) return;
  
  if(!state.assistantKey){
    alert('Please set your VoidAI API key in Settings');
    return;
  }
  
  try {
    const response = await fetch('https://api.voidai.app/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${state.assistantKey}`
      },
      body: JSON.stringify({
        model: 'gpt-4.1-mini',
        messages: [{
          role: 'user',
          content: `the user asks this, respond to them accordingly: ${query}`
        }]
      })
    });
    
    const data = await response.json();
    if(data.choices && data.choices[0]){
      alert(data.choices[0].message.content);
    } else {
      alert('No response from assistant');
    }
  } catch(err){
    alert('Error: ' + err.message);
  }
}

/* Init */
function init(){
  applySettings();
  render();
  if(!state.passwordEnabled){
    unlock();
  }
}
init();
